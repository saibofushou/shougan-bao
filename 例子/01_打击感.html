<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 打击感 · 小例子</title>
<style>
:root{--bg:#0d0b14;--panel:#17141f;--line:#2a2535;--txt:#ece7f5;--dim:#9a93a8;--acc:#ffc84a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:12px;padding:12px}
#side{flex:0 1 270px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
#stage{flex:1 1 420px;min-width:280px}
canvas{width:100%;max-width:640px;background:#05060d;border-radius:10px;display:block;touch-action:none}
h1{font-size:16px;margin:0 0 4px}
.tip{color:var(--dim);font-size:12px;margin:0 0 8px}
label{display:flex;gap:8px;align-items:flex-start;padding:2px 0;cursor:pointer}
label small{color:var(--dim);display:block;font-size:11px;line-height:1.3}
button{background:#2a2535;color:var(--txt);border:1px solid #3a3448;border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
@media(max-width:720px){#stage{order:-1}}  /* 手机上画面放最上面，开关在下面 */
</style>
</head>
<body>
<div id="side">
  <h1>01 打击感：汁水 12 招</h1>
  <p class="tip">鼠标左右移动（或 A / D、← →）控制飞船，自动开火；不操作时自动瞄准。一招一招打开，对比手感。</p>
  <label><input type="checkbox" id="auto" checked><span>自动进阶<small>从机枪开始，打怪攒经验，越打武器越强；手动点武器就关掉它</small></span></label>
  <div class="tip" style="margin:0">武器（数字键 1～5 也能换）：</div>
  <div class="row" id="guns"></div>
  <p class="tip" id="gunTip"></p>
  <div class="row">
    <button id="allOff">全关</button><button id="allOn">全开</button><button id="cut">减法版（推荐）</button>
  </div>
  <div id="toggles"></div>
  <hr>
  <label><input type="checkbox" id="rule"><span>收着用<small>顿帧只给打死大怪（0.12 秒）；冲击波只给大怪、缩成小涟漪；发光压暗；小怪的震屏减轻</small></span></label>
</div>
<div id="stage"><canvas id="c" width="1080" height="1296"></canvas></div>

<script>
// ===================== 参数表：改这里 =====================
// 时间单位：秒。距离单位：格（= 背景网格的一格；画面宽约 17 格）。
// 分小怪 / 中怪 / 大怪的写成 {小, 中, 大}。「× 几」的亮度：超过 1 就是「比白还亮」，会往外溢光。
const 参数 = {
  闪白: {时长: 0.035, 亮: 1.4},             // 约 1 帧：整只变纯白（身体填白、边比白还亮）。只闪 1 帧，所以还认得出是谁
  击退: {距离: 0.3, 衰减: 11, 大怪: 0.4},     // 每一枪沿子弹方向猛推 0.3 格，再按 e^(-11×秒) 退回原位；几枪叠加；大怪只推 0.4 倍
  挤压: {普通: 0.32, 暴击: 0.55, 封顶: 0.6, 衰减: 16, 横胖: 0.6, 竖扁: 0.45},  // 扁度 = 每枪 e^(-16×秒) 相加再封顶；宽 ×(1+0.6×扁)，高 ×(1-0.45×扁)
  后坐: {衰减: 28, 下移: 0.22, 横胖: 0.12, 竖扁: 0.16},  // 飞船每开一枪往后一缩，按 e^(-28×秒) 回来
  顿帧: {小: 0.05, 中: 0.08, 大: 0.3},       // 只在打死时；整个游戏停住（怪、子弹、火花、飘字都停），只有震屏照常抖
  震屏: {小: 0.22, 中: 0.38, 大: 1.1, 封顶: 1.3},  // 每次击杀加的「创伤值」，几次叠加
  震屏衰减: {小: 9, 中: 9, 大: 4},            // 创伤值按 e^(-衰减×秒) 退；大怪退得慢
  震屏幅度: 0.45, 震屏细抖: 0.12, 震屏转角: 0.02,  // 位移 = 创伤²×0.45 格 + 创伤×0.12 格，用几条快的正弦（平滑地晃，不是每帧乱跳）；转角 = 创伤²×0.02 弧度
  冲击波: {时长: 0.8, 扩散: 11, 大小: {小: 0.6, 中: 0.9, 大: 2.2}, 环宽: 0.07, 环宽每大小: 0.05, 不透明: 0.55, 推网格: 0.55, 推宽: 0.9},
  //   半径 = 0.3 + 秒 × 11 × √大小 格（大怪 0.8 秒后约 13 格 = 大半个屏）；环越扩越淡：不透明 0.55 × (1-进度)^1.5；网格被推开 大小×0.55 格
  命中火花: {颗: 5, 寿: 0.28, 速: [7, 13], 散: 1.8, 长: 0.35, 宽: 0.06},  // 往子弹来的方向溅回去（±0.9 弧度）；暴击是白的
  碎片: {数: {小: 14, 中: 22, 大: 70}, 寿: {小: 0.6, 中: 0.8, 大: 1.6}, 速: [3, 11], 阻力: 3.2, 大小: [0.1, 0.24], 大怪更快: 1.6, 大怪更大: 1.4, 转: 9},  // 每 4 片有 1 片白的
  飘字: {时长: 0.75, 开始淡: 0.5, 上飘: 2.6, 散横: 1.8, 散竖: 0.6, 字高: 0.58, 暴击放大: 1.7, 暴击抖: 0.25, 抖幅: 0.08, 弹簧阻尼: 8, 弹簧刚度: 260},
  //   弹簧弹出（冲到 1.45 倍再回来）→ 匀速往上飘 2.6 格/秒 → 0.5 秒后 0.25 秒淡掉；位置随机散开，同一处的字不会叠死
  暴击: {率: 0.2, 倍: 3},
  子弹: {速度: 30, 头长: 0.34, 头宽: 0.14, 尾长: 1.6, 尾宽: 0.12},   // 关掉「拖尾」时子弹只是一个小圆点
  枪口火光: {时长: 0.045, 亮: 3, 大小: 0.5},
  发光: {亮度倍数: 1.7, 泛光强度: 0.75, 泛光半径: 0.4, 门槛: 0.4},
  //   亮度倍数：发光的东西颜色 ×1.7（超过白）；泛光：亮度超过门槛的部分，按 5 层由小到大的模糊叠回去；最后用电影式色调曲线压回屏幕能显示的范围（太亮的变白热，周围留彩色光晕）
  光点: {数: {小: 4, 中: 7, 大: 16}, 先等: 0.05, 间隔: 0.03, 飞行: 0.55, 甩横: 3, 甩竖: 2, 大小: 0.13},
  分数: {小: 100, 中: 250, 大: 2000, 等: 0.45, 滚: 0.35},  // 打死后等 0.45 秒（光点飞到）再用 0.35 秒匀速滚上去
  连击断开: 0.8,                            // 多久没打中，连击清零（连击字也消失）
  音调每连击: 1 / 24, 音调封顶连击: 36,       // 每连击一次升高 1/24 个八度，24 次正好一个八度，36 次封顶
  // 「收着用」（打击感做减法）：没写的照全开
  收着: {顿帧: {小: 0, 中: 0, 大: 0.12}, 泛光强度: 0.28, 亮度倍数: 1.25, 冲击波大小: 0.4, 冲击波只给大怪: true, 震屏: {小: 0.35, 中: 0.6, 大: 1}},
  // 武器：同样 12 招，换一种武器手感就完全不同。伤 = 每一下的伤害倍数（基础 14～26 点；小怪 40 血、中怪 95、大怪 560），推 = 击退倍数
  武器: {
    机枪:   {射速: 1 / 16, 伤: 1,   推: 1,    色: '#ffe066', 说: '一秒 16 发、一下很轻：靠连击数和音调往上走撑手感'},
    散弹:   {射速: 0.36, 伤: 1,   推: 0.8,  色: '#ff9a3d', 颗数: 6, 散角: 0.6, 射程: 0.5, 说: '一次 6 颗扇形、射程短：贴脸一喷满屏火花，后坐力大'},
    激光:   {每跳: 0.07, 伤: 0.6, 推: 0.25, 色: '#ff4df0', 宽: 0.24, 说: '一直照着、每 0.07 秒扣一次血：没有「一下」，靠接触点的亮团和抖动的光束撑手感'},
    导弹:   {射速: 0.42, 伤: 3,   推: 1.6,  色: '#7dffcf', 转向: 6, 爆炸半径: 1.85, 说: '慢、会拐弯追怪，炸开时溅伤一圈：等了一会儿之后的「砰」最爽'},
    电磁炮: {射速: 0.8,  伤: 5,   推: 2.5,  色: '#9fd8ff', 说: '很久才一发，瞬间打穿一整列怪：每一发都要大后坐、大震屏、光束慢慢消失'},
  },
  // 自动进阶：打死怪给经验，攒满就换下一把（机枪→散弹→激光→导弹→电磁炮）
  进阶: {
    经验: {小: 1, 中: 3, 大: 12},
    升级所需: [8, 20, 32, 46],    // 第 1 次升级只要 8 点，之后越来越多：前面升得快，让人马上尝到甜头
    庆祝时长: 1.4,                // 「武器升级！」大字停多久
    满级后重来: 25,               // 满级玩多少秒后从机枪重新来一轮（演示用）
  },
};
// ===========================================================

const 招 = [
  ['flash', '闪白', '打中那一帧整只变白'],
  ['knock', '击退', '每一枪往后推一下再回来'],
  ['squash', '挤压拉伸', '被打扁再弹回；飞船开枪往后缩'],
  ['num', '伤害飘字', '弹出→上飘→淡出，暴击大、红、抖'],
  ['part', '粒子', '命中溅火花，打死碎一地'],
  ['stop', '顿帧', '打死那一刻整个游戏停一下'],
  ['shake', '震屏', '越大的爆炸抖得越狠'],
  ['shock', '冲击波', '一圈光环推开网格'],
  ['trail', '拖尾和枪口火光', ''],
  ['glow', '发光', '亮的地方往外溢光'],
  ['sound', '音效', '连着打中音调往上走'],
  ['combo', '连击和分数', '分数哗哗地滚'],
];
const on = {};
const box = document.getElementById('toggles');
for (const [k, n, s] of 招) {
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" data-k="${k}"><span>${n}${s ? `<small>${s}</small>` : ''}</span>`;
  box.appendChild(l);
}
const rule = document.getElementById('rule');
function 同步() { for (const i of box.querySelectorAll('input')) on[i.dataset.k] = i.checked; }
function 设(ks, r) { for (const i of box.querySelectorAll('input')) i.checked = ks.includes(i.dataset.k); rule.checked = r; 同步(); }
box.addEventListener('change', 同步);
document.getElementById('allOff').onclick = () => 设([], false);
document.getElementById('allOn').onclick = () => 设(招.map(z => z[0]), false);
document.getElementById('cut').onclick = () => 设(招.map(z => z[0]), true);
设(招.map(z => z[0]), false);   /* 打开就是全开，看完再点「减法版」对比 */
let 武 = '机枪';
const 枪栏 = document.getElementById('guns');
const 枪名 = Object.keys(参数.武器);
const 自动 = document.getElementById('auto');
let 级 = 0, 经验 = 0, 满级时 = null, 升时 = -9, 升名 = '';
function 换武器(n, 是自动) {
  if (!是自动) 自动.checked = false;   // 手动挑了武器，就不再自动升级
  武 = n; 冷却 = 0;
  for (const b of 枪栏.children) b.classList.toggle('on', b.textContent.endsWith(n));
  document.getElementById('gunTip').textContent = 参数.武器[n].说;
}
枪名.forEach((n, i) => { const b = document.createElement('button'); b.textContent = `${i + 1} ${n}`; b.onclick = () => 换武器(n, false); 枪栏.appendChild(b); });

// ---------------- 画布 ----------------
// 游戏按 640×768 的「逻辑像素」算；真正画在 1080×1296 上（和原片同样的清晰度，发光的大小才对得上）。
const cv = document.getElementById('c'), 屏 = cv.getContext('2d');
const W = 640, H = 768, GW = cv.width, GH = cv.height, 倍 = GW / W;
const 格 = W / 16.875;   // 一格多少逻辑像素（画面宽约 16.9 格）
const 收着 = () => rule.checked;
const 种类 = {
  小: {hp: 40, r: 0.42, 色: '#ff3db8', 边: 4, 名: '小'},
  中: {hp: 95, r: 0.62, 色: '#ffa53d', 边: 6, 名: '中'},
  大: {hp: 560, r: 1.15, 色: '#6dff5a', 边: 4, 名: '大'},
};
let 光束 = [], 激光端 = null, 激光跳 = 0;
let 敌 = [], 弹 = [], 火花 = [], 碎片 = [], 字 = [], 波 = [], 光点 = [], 杀分 = [], 震 = [];
const 船 = {x: W / 2, y: H - 80, 枪时: -9, 后坐强: 1, 火光强: 1};
let 上次操作 = -9, 目标x = W / 2, 冷却 = 0, 顿 = 0, 连击 = 0, 上次中 = -9, 底分 = 0, 时 = 0, 游 = 0, 生成 = 0, 大计时 = 4;
const 键 = {};
addEventListener('keydown', e => { 键[e.key.toLowerCase()] = true; 上次操作 = 时; const i = '12345'.indexOf(e.key); if (i >= 0) 换武器(枪名[i], false); });
addEventListener('keyup', e => 键[e.key.toLowerCase()] = false);
cv.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); 目标x = (e.clientX - r.left) / r.width * W; 上次操作 = 时; });

function 出怪(k) {
  const t = 种类[k];
  敌.push({k, 色: t.色, 边: t.边, r: t.r * 格, hp: t.hp, hpMax: t.hp, x: 60 + Math.random() * (W - 120), y: -50, ph: Math.random() * 6, 白: -9, 击: []});
}
// 怪现在画在哪：底下的位置 + 击退（每一枪推一下再退回，几枪叠加）
function 击退量(e) {
  let x = 0, y = 0;
  if (on.knock) for (const h of e.击) { const a = 游 - h.t; if (a < 0.6) { const k = 参数.击退.距离 * 格 * h.推 * Math.exp(-a * 参数.击退.衰减); x += h.dx * k; y += h.dy * k; } }
  const m = e.k === '大' ? 参数.击退.大怪 : 1;
  return [x * m, y * m];
}
const 位 = e => { const [a, b] = 击退量(e); return [e.x + a, e.y + b]; };

// ---------------- 声音（全部现算，不用音频文件） ----------------
let ac = null, 噪声 = null, 总音 = null;
function 音() {
  if (!on.sound) return null;
  if (!ac) {
    ac = new AudioContext(); 总音 = ac.createGain(); 总音.gain.value = 0.6; 总音.connect(ac.destination);
    噪声 = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = 噪声.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return ac;
}
// 一层声音：波形（或噪声→滤波）+ 指数衰减。频率可以从 f0 滑到 f1。
function 层(类型, f0, f1, 时长, 衰减, 音量, 滤 = null) {
  const t = ac.currentTime, v = ac.createGain();
  v.gain.setValueAtTime(音量, t); v.gain.setTargetAtTime(0, t, 1 / 衰减);
  let src;
  if (类型 === 'noise') { src = ac.createBufferSource(); src.buffer = 噪声; src.loopStart = Math.random(); }
  else { src = ac.createOscillator(); src.type = 类型; src.frequency.setValueAtTime(f0, t); if (f1) src.frequency.linearRampToValueAtTime(f1, t + 时长); }
  let n = src;
  if (滤) { const f = ac.createBiquadFilter(); f.type = 滤[0]; f.frequency.value = 滤[1]; if (滤[2]) f.Q.value = 滤[2]; n.connect(f); n = f; }
  n.connect(v).connect(总音); src.start(t, 类型 === 'noise' ? Math.random() : 0); src.stop(t + 时长);
}
const 声 = {
  枪() { if (!音()) return; 层('square', 1500, 520, 0.07, 55, 0.5 * 0.10 * 0.3); 层('noise', 0, 0, 0.07, 90, 0.3 * 0.10, ['highpass', 3000]); },
  中(连, 暴) {
    if (!音()) return; const f0 = 520 * Math.pow(2, Math.min(连, 参数.音调封顶连击) * 参数.音调每连击);
    层('sine', f0 * 1.6, f0, 0.09, 40, 0.22); 层('noise', 0, 0, 0.09, 120, 0.5 * 0.22, ['bandpass', 4200, 0.9]);
    if (暴) 层('sawtooth', f0 * 2, 0, 0.09, 35, 0.6 * 0.22 * 0.5);
  },
  死(k) {
    if (!音()) return; const d = {小: 0.35, 中: 0.55, 大: 1.8}[k], g = {小: 0.45, 中: 0.6, 大: 1}[k];
    层('sine', {小: 220, 中: 160, 大: 110}[k], 40, d, {小: 14, 中: 9, 大: 3.2}[k], 0.9 * g);
    层('noise', 0, 0, d, {小: 18, 中: 10, 大: 2.6}[k], 0.7 * g * 0.6, ['lowpass', {小: 5000, 中: 3500, 大: 2500}[k]]);
  },
  其他(类型, f0, f1, 时长, 音量) { if (音()) 层(类型, f0, f1, 时长, 4 / 时长, 音量); },
  噪(时长, 音量, 低通) { if (音()) 层('noise', 0, 0, 时长, 4 / 时长, 音量, ['lowpass', 低通]); },
};
addEventListener('pointerdown', () => { if (ac) ac.resume(); else if (on.sound) 音(); });

// ---------------- 打中、打死 ----------------
function 命中(e, b) {
  const 暴 = Math.random() < 参数.暴击.率, 伤 = Math.round((14 + Math.random() * 13 | 0) * (b.伤 ?? 1) * (暴 ? 参数.暴击.倍 : 1));
  const [ex, ey] = 位(e), 长 = Math.hypot(b.vx, b.vy) || 1, dx = b.vx / 长, dy = b.vy / 长;
  e.hp -= 伤; e.白 = 游;
  e.击.push({t: 游, dx, dy, 暴, 推: b.推 ?? 1}); if (e.击.length > 40) e.击.shift();
  if (on.num) 字.push({x: b.x + (Math.random() - 0.5) * 参数.飘字.散横 * 格, y: b.y - (0.5 + (Math.random() - 0.5) * 参数.飘字.散竖) * 格, 文: 伤 + (暴 ? '!' : ''), 暴, t: 游});
  if (on.part) for (let i = 0; i < 参数.命中火花.颗; i++) {   // 火花往子弹来的方向溅回去
    const [v0, v1] = 参数.命中火花.速;
    火花.push({x: b.x, y: b.y, a: Math.atan2(-dy, -dx) + (Math.random() - 0.5) * 参数.命中火花.散, v: (v0 + Math.random() * (v1 - v0)) * 格, t: 游, 暴, 色: b.色 && b.色 !== '#ffe066' ? b.色 : '#ffe9a0'});
  }
  连击 = 游 - 上次中 < 参数.连击断开 ? 连击 + 1 : 1; 上次中 = 游;
  声.中(连击, 暴);
  if (e.hp <= 0) 击杀(e, ex, ey);
}
function 加震(v, 衰) { if (on.shake) 震.push({t: 时, v, 衰}); }
function 击杀(e, x, y) {

  // 连击：字号随连击变大（60 + 连击，最多 100），颜色从黄变红，每打中一下猛一放大、歪一下
  if (加 && 连击 > 1 && 游 - 上次中 < 参数.连击断开) {
    const 热 = Math.min(1, 连击 / 50), 跳 = Math.exp(-(游 - 上次中) * 14);
    g.save(); g.translate(GW - 50, 92); g.scale(1 + 跳 * 0.35, 1 + 跳 * 0.35); g.rotate(-跳 * 6 * Math.PI / 180);
    g.textAlign = 'right'; g.font = `italic 900 ${60 + Math.min(40, 连击)}px system-ui,sans-serif`;
    g.shadowColor = 'rgba(0,0,0,0.8)'; g.shadowBlur = 10; g.shadowOffsetY = 4; g.fillStyle = '#000'; g.fillText('连击 ×' + 连击, 0, 0);
    g.shadowColor = 'rgba(255,120,60,0.7)'; g.shadowBlur = 18; g.shadowOffsetY = 0;
    g.fillStyle = `rgb(255,${Math.round(230 - 150 * 热)},${Math.round(120 - 80 * 热)})`; g.fillText('连击 ×' + 连击, 0, 0); g.restore();
  }
  g.setTransform(倍, 0, 0, 倍, 0, 0);
  // 升级庆祝：屏幕轻闪 + 中间大字弹出
  const 升 = 时 - 升时, 色号 = 参数.武器[武].色;
  if (升 < 0.25) { g.fillStyle = `rgba(255,255,255,${0.28 * (1 - 升 / 0.25)})`; g.fillRect(0, 0, W, H); }
  if (升 < 参数.进阶.庆祝时长) {
    const a = 升 / 参数.进阶.庆祝时长, p = Math.min(1, 升 / 0.18), 弹2 = p < 1 ? 1 + 2.2 * (p - 1) ** 2 + 3.2 * (p - 1) ** 3 : 1;
    g.save(); g.translate(W / 2, H * 0.42); g.scale(弹2, 弹2); g.globalAlpha = a > 0.75 ? 1 - (a - 0.75) / 0.25 : 1;
    g.textAlign = 'center'; g.lineJoin = 'round';
    g.font = '900 20px system-ui,sans-serif'; g.lineWidth = 6; g.strokeStyle = '#0a0612'; g.strokeText(升名, 0, -34); g.fillStyle = '#fff'; g.fillText(升名, 0, -34);
    g.font = '900 54px system-ui,sans-serif'; g.lineWidth = 8; g.strokeText(武, 0, 22);
    g.shadowColor = 色号; g.shadowBlur = 26; g.fillStyle = 色号; g.fillText(武, 0, 22);
    g.restore();
  }
  // 经验条（底部）：攒到哪了、下一把是什么，让人有盼头
  g.textAlign = 'left'; g.font = '900 13px system-ui,sans-serif';
  if (自动.checked) {
    const 满 = 级 >= 枪名.length - 1, 比 = 满 ? 1 : 经验 / 参数.进阶.升级所需[级], x0 = 20, x1 = W - 20, y = H - 24;
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(x0, y, x1 - x0, 6);
    g.save(); g.fillStyle = 色号; g.shadowColor = 色号; g.shadowBlur = 10; g.fillRect(x0, y, (x1 - x0) * 比, 6); g.restore();
    g.fillStyle = 'rgba(255,255,255,0.75)'; g.fillText(`Lv${级 + 1} ${武}`, x0, y - 7);
    g.textAlign = 'right'; g.fillText(满 ? '满级！' : `下一把：${枪名[级 + 1]}`, x1, y - 7);
  } else { g.fillStyle = 'rgba(255,255,255,0.55)'; g.fillText(`手动：${武}`, 20, H - 30); }
  if (顿 > 0) { g.textAlign = 'left'; g.font = '12px system-ui'; g.fillStyle = '#888'; g.fillText('顿帧中', 20, H - 6); }
  g.setTransform(1, 0, 0, 1, 0, 0);
}
换武器('机枪', true);
requestAnimationFrame(帧);
</script>
