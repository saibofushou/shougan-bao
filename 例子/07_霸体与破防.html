<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>07 霸体与破防 · 小例子</title>
<style>
:root{--bg:#2a1a14;--panel:#3a2519;--line:#5a3c2a;--txt:#fff4e6;--dim:#e0c3a6;--acc:#ffc83d;--ink:#1a1026}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 70% 0,#5a3524,var(--bg) 60%);color:var(--txt);font:14px/1.5 system-ui,'PingFang SC','Microsoft YaHei',sans-serif;display:flex;flex-wrap:wrap;gap:12px;padding:12px;min-height:100vh}
#side{flex:0 1 300px;background:var(--panel);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);border-radius:14px;padding:14px}
#stage{flex:1 1 480px;min-width:280px;max-width:980px}
canvas{width:100%;border-radius:14px;display:block;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
h1{font-size:19px;margin:0 0 4px;font-weight:900;font-style:italic}
h1 b{color:var(--acc)}
h2{font-size:13px;color:var(--acc);margin:12px 0 2px;font-weight:900}
.tip{color:var(--dim);font-size:12px;margin:0 0 6px}
label{display:flex;gap:8px;align-items:flex-start;padding:2px 0;cursor:pointer}
label small{color:var(--dim);display:block;font-size:11px;line-height:1.3}
button{background:#5a3a26;color:#fff;border:2px solid var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:800;box-shadow:0 3px 0 var(--ink)}
button:hover{background:#6e4730}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#ai{background:var(--acc);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
#pad{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#pad button{flex:1;padding:12px 4px;touch-action:none;min-width:70px;font-size:14px}
#pad button[data-k=j]{background:#4d8dff}#pad button[data-k=k]{background:#ff4d5e}#pad button[data-k=i]{background:#b07bff}#pad button[data-k=u]{background:#3fd46b;color:var(--ink)}#pad button[data-k=l]{background:#9fd3ff;color:var(--ink)}
#stat{font-size:12px;color:var(--dim);background:rgba(0,0,0,.2);border-radius:8px;padding:6px 8px}
@media(max-width:760px){#stage{order:-1}}  /* 手机上画面放最上面，开关在下面 */
</style>
</head>
<body>
<div id="side">
  <h1>07 <b>霸体</b>与破防</h1>
  <p class="tip">A/D 走　J 轻砍　K 重劈　I 连刺（一招 3 下）　U 抓　按住 L 格挡。<br>轻砍只能掉血（打断力 20 &lt; 韧性 30），重劈能打断它（45 &gt; 30）；Boss 身上冒金光时是霸体（韧性 80），重劈也劈不停。每砍一下，Boss 头顶会把两个数摆出来比给你看。</p>
  <div class="row"><button id="ai">▶ 让 AI 一直重劈</button><button id="reset">重来</button></div>
  <div id="stat"></div>
  <h2>预设</h2>
  <div class="row"><button data-p="good">推荐</button><button data-p="none">没有霸体</button><button data-p="inf">霸体无上限</button><button data-p="hide">看不见的霸体</button></div>
  <h2>开关</h2>
  <div id="toggles"></div>
</div>
<div id="stage"><canvas id="c"></canvas>
  <div id="pad"><button data-k="a">← A</button><button data-k="d">D →</button><button data-k="j">轻砍 J</button><button data-k="k">重劈 K</button><button data-k="i">连刺 I</button><button data-k="u">抓 U</button><button data-k="l">挡 L</button></div>
</div>

<script>
// ===================== 参数表：改这里（逻辑每秒 60 帧，距离单位 = 格） =====================
const 参数 = {
  基础韧性: 30,        // 平时
  霸体韧性: 80,        // 出霸体招的那几帧
  霸体上限: 2,         // 霸体最多吃几下，再挨一下就碎
  我的招: {
    轻: {出手: 5,  命中: 3, 收招: 14, 打断力: 20, 伤害: 10, 距离: 2.1},
    重: {出手: 16, 命中: 4, 收招: 20, 打断力: 45, 伤害: 28, 距离: 2.3},
    连: {出手: 6,  命中: 12, 收招: 16, 打断力: 15, 伤害: 6, 距离: 2.1, 段数: 3},  // 多段：一招打 3 下
    抓: {出手: 6,  命中: 2, 收招: 26, 打断力: 999, 伤害: 22, 距离: 1.6, 抓: true},
  },
  Boss招: {
    挥: {前摇: 30, 命中: 8, 收招: 30, 伤害: 10, 削: 25, 距离: 2.6, 霸体: false},
    砸: {前摇: 40, 命中: 10, 收招: 40, 伤害: 30, 削: 50, 距离: 3.2, 霸体: true},
  },
  被打断后退: 0.5, 被打断愣: 24,
  碎霸体愣: 50,
  躯干满: 100, 躯干回复: 30,   // 每秒；不挡了 1 秒后开始回
  破防愣: 90,
  我的血: 300, Boss血: 600,
};
// ==========================================================================================

const 项 = [
  ['armor', '霸体', 'Boss 出大招那几帧韧性 30 → 80；关掉就会被重劈一直打断、大招永远出不来'],
  ['cap', '有上限', '霸体吃 2 下，第 3 下碎；关掉就是无限霸体'],
  ['see', '看得见', '脚下金色光阵 + 往上飘的光点 + 身上金光 + 头顶韧性表变金'],
  ['grab', '抓取是钥匙', '霸体防打断，不防抓'],
  ['multi', '多段是钥匙', '连刺一招打 3 下，正好把霸体吃满打碎'],
  ['guard', '格挡要付代价（躯干条）', '挡一下涨一截，满了破防愣住；关掉就是免费格挡'],
];
const box = document.getElementById('toggles'), on = {};
for (const [k, n, s] of 项) { const l = document.createElement('label'); l.innerHTML = `<input type="checkbox" data-k="${k}" checked><span>${n}<small>${s}</small></span>`; box.appendChild(l); }
const 同步 = () => box.querySelectorAll('input').forEach(i => on[i.dataset.k] = i.checked);
box.addEventListener('change', 同步); 同步();
const 预设 = {good: {armor: 1, cap: 1, see: 1, grab: 1, multi: 1, guard: 1}, none: {armor: 0, cap: 1, see: 1, grab: 1, multi: 1, guard: 1}, inf: {armor: 1, cap: 0, see: 1, grab: 0, guard: 1}, hide: {armor: 1, cap: 1, see: 0, grab: 1, multi: 1, guard: 1}};
document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const p = 预设[b.dataset.p]; box.querySelectorAll('input').forEach(i => i.checked = !!p[i.dataset.k]); 同步(); 重来(); });

// ---------------- 状态 ----------------
let 帧号, 我, 敌, 字, 碎片, 光点, 震, 计, 火花, 比较, AI = false;
const 键 = {};
function 重来() {
  帧号 = 0; 字 = []; 碎片 = []; 光点 = []; 震 = 0; 火花 = []; 比较 = null;
  我 = {x: 3, 血: 参数.我的血, 招: null, 段: '', 剩: 0, 已中: false, 挡: false, 躯干: 0, 不挡: 99, 愣: 0, 闪: 0, 起: 0, 步: 0, 走: 0, 破: false};
  敌 = {x: 7, 血: 参数.Boss血, 招: null, 段: '走', 剩: 40, 霸体中: false, 吃下: 0, 愣: 0, 闪: 0, 序: 0, 光: 0, 步: 0, 走: 0, 段起: 0};
  计 = {砸出: 0, 砸断: 0, 碎: 0, 破防: 0};
}
重来();
addEventListener('keydown', e => { const k = e.key.toLowerCase(); 键[k] = true; if ('jkiu'.includes(k) && k.length === 1) 出手(k); });
addEventListener('keyup', e => { 键[e.key.toLowerCase()] = false; });
document.querySelectorAll('#pad button').forEach(b => {
  b.onpointerdown = e => { e.preventDefault(); 键[b.dataset.k] = true; if ('jkiu'.includes(b.dataset.k)) 出手(b.dataset.k); };
  b.onpointerup = b.onpointerleave = () => 键[b.dataset.k] = false;
});
document.getElementById('reset').onclick = 重来;
const AI钮 = document.getElementById('ai');
AI钮.onclick = () => { AI = !AI; AI钮.textContent = AI ? '■ 停 AI' : '▶ 让 AI 一直重劈'; };
if (location.hash === '#ai') AI钮.onclick();   // 网址后面加 #ai，打开就让 AI 开打
const 招名 = {j: '轻', k: '重', i: '连', u: '抓'};
function 出手(k) {
  if (我.招 || 我.愣 > 0) return;
  const z = 参数.我的招[招名[k]];
  if ((z.抓 && !on.grab) || (z.段数 && !on.multi)) return;
  我.招 = z; 我.键 = 招名[k]; 我.段 = '出'; 我.剩 = z.出手; 我.已中 = false; 我.中次 = 0; 我.起 = 帧号;
}
function 飘(文, x, y, 色, 大) { 字.push({文, x, y, 色, 帧: 帧号, 大}); }

// 当前韧性：霸体招的前摇和命中帧里临时调高
const 韧性 = () => 敌.霸体中 ? 参数.霸体韧性 : 参数.基础韧性;

function 我打中(z) {
  敌.血 = Math.max(0, 敌.血 - z.伤害);
  飘(z.伤害, 敌.x + 1.1, 3.6, '#fff');
  const 韧 = 韧性(), 霸 = 敌.霸体中;
  const 花 = (hue, big) => 火花.push({x: X(敌.x) - 34, y: 地 - 190, 帧: 帧号, big, hue, seed: 帧号 % 97});
  if (z.抓 || z.打断力 > 韧) { 比较 = {力: z.抓 ? '抓' : z.打断力, 韧, 霸, 果: z.抓 ? '抓住' : '断', 帧: 帧号}; 花('#62d4ff', 1.1); 打断敌(z.抓 ? '抓住了！' : '打断！'); return; }
  // 打不断：只掉血、出火花；霸体中才记次数
  if (!霸) { 比较 = {力: z.打断力, 韧, 霸, 果: '打不动', 帧: 帧号}; 花('#ffffff', 0.5); return; }
  敌.吃下++;
  花('#ffd23f', 0.8);
  for (let i = 0; i < 8; i++) 碎片.push({x: 敌.x - 0.6, y: 3.2, vx: -Math.random() * 6, vy: (Math.random() - 0.3) * 6, 命: 0.25, 色: '#ffe9a0'});
  if (on.cap && 敌.吃下 > 参数.霸体上限) {
    计.碎++; 震 = 0.8; 比较 = {力: z.打断力, 韧, 霸, 果: '碎', 帧: 帧号};
    for (let i = 0; i < 30; i++) 碎片.push({x: 敌.x, y: 3, vx: (Math.random() - 0.5) * 12, vy: Math.random() * 9, 命: 0.8, 色: '#ffcc33', 片: 1, 转: Math.random() * 6});
    打断敌(null, 参数.碎霸体愣);
  } else 比较 = {力: z.打断力, 韧, 霸, 果: '扛住', 帧: 帧号};
}
function 打断敌(说, 愣 = 参数.被打断愣) {
  if (敌.段 === '愣' && 说 !== '抓住了！') return;  // 已经在愣，不重新算（不然一直轻砍能把它锁死）
  if (敌.招 && 敌.招.霸体 && 敌.段 === '前摇') 计.砸断++;  // 大招还没砸下来就被打断
  敌.招 = null; 敌.段 = '愣'; 敌.剩 = 愣; 敌.愣总 = 愣; 敌.霸体中 = false; 敌.吃下 = 0; 敌.闪 = 6; 敌.段起 = 帧号;
  敌.x = Math.min(10.5, 敌.x + 参数.被打断后退);
  if (说) 飘(说, 敌.x, 5.6, '#7cf0ff', 1);
}
function 敌打中(z) {
  if (我.挡 && 我.愣 <= 0) {
    飘('挡', 我.x + 0.6, 3.6, '#9fd0ff'); 我.挡闪 = 帧号;
    if (on.guard) { 我.躯干 += z.削; 我.不挡 = 0; if (我.躯干 >= 参数.躯干满) { 我.躯干 = 0; 我.愣 = 参数.破防愣; 我.破 = true; 我.挡 = false; 计.破防++; 飘('破防！', 我.x, 4.6, '#ff5a6a', 1); 震 = 0.6; } }
    return;
  }
  我.血 = Math.max(0, 我.血 - z.伤害); 我.闪 = 6; 我.招 = null; 我.愣 = Math.max(我.愣, 12); 我.挨 = 帧号;
  我.x = Math.max(0.5, 我.x - 0.6); 飘(z.伤害, 我.x, 3.8, '#ff5a6a'); 震 = Math.max(震, z.霸体 ? 0.7 : 0.3);
  火花.push({x: X(我.x) + 20, y: 地 - 170, 帧: 帧号, big: z.霸体 ? 1.3 : 0.8, hue: '#ff6b3b', seed: 帧号 % 89});
}

// ---------------- 每帧 ----------------
function 一帧() {
  帧号++;
  const 我旧x = 我.x, 敌旧x = 敌.x;
  if (AI) { if (Math.abs(敌.x - 我.x) > 1.9) 我.x += 0.08; else 出手('k'); }
  // 我
  if (我.愣 > 0) 我.愣--; else 我.破 = false;
  我.挡 = !!键.l && !我.招 && 我.愣 <= 0;
  if (!我.招 && 我.愣 <= 0 && !我.挡) { if (键.a) 我.x -= 0.08; if (键.d) 我.x += 0.08; }
  我.x = Math.max(0.5, Math.min(敌.x - 1.3, 我.x));
  if (!我.挡) { 我.不挡++; if (我.不挡 > 60) 我.躯干 = Math.max(0, 我.躯干 - 参数.躯干回复 / 60); }
  if (我.招) {
    我.剩--;
    if (我.段 === '出' && 我.剩 <= 0) { 我.段 = '中'; 我.剩 = 我.招.命中; }
    if (我.段 === '中') {
      const 段 = 我.招.段数 || 1, 间 = Math.floor(我.招.命中 / 段), 过 = 我.招.命中 - 我.剩;  // 多段招每隔几帧打一下
      if (我.中次 < 段 && 过 >= 我.中次 * 间 && 敌.x - 我.x <= 我.招.距离) { 我.中次++; 我.已中 = true; 我打中(我.招); } if (我.剩 <= 0) { 我.段 = '收'; 我.剩 = 我.招.收招; } }
    else if (我.段 === '收' && 我.剩 <= 0) 我.招 = null;
  }
  // Boss：走近 → 挥 / 砸 交替（砸的那一下带霸体）
  敌.剩--;
  const 段前 = 敌.段;
  if (敌.段 === '走') { if (敌.x - 我.x > 2.2) 敌.x -= 0.03; if (敌.剩 <= 0) { const z = 敌.序++ % 2 ? 参数.Boss招.砸 : 参数.Boss招.挥; 敌.招 = z; 敌.段 = '前摇'; 敌.剩 = z.前摇; 敌.吃下 = 0; 敌.霸体中 = on.armor && z.霸体; } }
  else if (敌.段 === '前摇' && 敌.剩 <= 0) { 敌.段 = '命中'; 敌.剩 = 敌.招.命中; 敌.已中 = false; 敌.霸体中 = false; if (敌.招.霸体) { 计.砸出++; 震 = Math.max(震, 0.5); } }
  else if (敌.段 === '命中') { if (!敌.已中 && 敌.x - 我.x <= 敌.招.距离) { 敌.已中 = true; 敌打中(敌.招); } if (敌.剩 <= 0) { 敌.段 = '收'; 敌.剩 = 敌.招.收招; 敌.霸体中 = false; } }
  else if ((敌.段 === '收' || 敌.段 === '愣') && 敌.剩 <= 0) { 敌.剩 = 敌.段 === '愣' ? 8 : 我.愣 > 30 ? 4 : 50; 敌.招 = null; 敌.段 = '走'; }  // 你破防了，它马上再来一下
  if (敌.段 !== 段前) { 敌.段起 = 帧号; 敌.段长 = Math.max(1, 敌.剩); }
  // 霸体光：蓄得越久越亮
  敌.光 = 敌.霸体中 ? Math.min(1, 敌.光 + 1 / 40) : Math.max(0, 敌.光 - 0.08);
  if (on.see && 敌.霸体中 && 帧号 % 3 === 0) 光点.push({x: 敌.x + (Math.random() - 0.5) * 2.2, y: 0, vy: 2 + Math.random() * 2, 命: 1, s: 2 + Math.random() * 3});
  for (const p of 碎片) { p.x += p.vx / 60; p.y += p.vy / 60; p.vy -= 20 / 60; p.命 -= 1 / 60; }
  for (const p of 光点) { p.y += p.vy / 60; p.命 -= 1 / 60; }
  碎片 = 碎片.filter(p => p.命 > 0 && p.y > -0.2); 光点 = 光点.filter(p => p.命 > 0); 字 = 字.filter(z => 帧号 - z.帧 < 50);
  if (我.闪) 我.闪--; if (敌.闪) 敌.闪--;
  我.走 = Math.abs(我.x - 我旧x) > 0.001 ? 1 : 0; 我.步 += (我.x - 我旧x) * 2.2;
  敌.走 = Math.abs(敌.x - 敌旧x) > 0.001 ? 1 : 0; 敌.步 -= (敌.x - 敌旧x) * 2.2;
  震 *= 0.88;
  if (敌.血 <= 0 || 我.血 <= 0) { 飘(敌.血 <= 0 ? 'Boss 倒下' : '你倒下了', 5, 6, '#fff', 1); 敌.血 = 参数.Boss血; 我.血 = 参数.我的血; }
}

const INK = '#1a1026', GOLD = '#ffc83d';
const L = {torso: 108, neck: 14, uarm: 72, farm: 66, thigh: 100, shin: 98};
const STANCE = {rx: 0, ry: 184, rot: 0, lean: 8, head: -4, fh: [64, 24], bh: [34, -8], ff: [58, 0], bf: [-60, 0], face: 'calm'};
const P = o => ({...STANCE, ...o});
const CROUCH = P({ry: 142, lean: 24, fh: [54, 16], bh: [30, -12], ff: [62, 0], bf: [-62, 0]});
// 每招的关键姿势：[第几帧, 姿势]（脸朝右）
const 动作 = {
  jab: [[0, {}], [2, {fh: [70, 20], lean: 10}], [4, {fh: [136, 26], lean: 18, rx: 12, head: -2, bh: [26, -4], ff: [66, 0], face: 'shout'}], [7, {fh: [130, 24], lean: 16, rx: 10, face: 'shout'}], [12, {}]],
  heavy: [[0, {}], [4, {lean: -2, rx: -8, ry: 178, bh: [-12, -26], fh: [60, 30]}], [7, {lean: 16, rx: 18, bh: [70, 6], fh: [40, 10], ff: [90, 0]}],
    [8, {lean: 30, rx: 34, ry: 172, bh: [138, 20], fh: [18, -12], ff: [104, 0], bf: [-64, 0], face: 'shout'}], [15, {lean: 28, rx: 32, ry: 172, bh: [132, 18], fh: [18, -12], ff: [104, 0], face: 'shout'}], [28, {}]],
  rush: [[0, {}], [3, {...CROUCH, lean: 32, ry: 156, fh: [40, -4], bh: [6, -24], ff: [80, 0], bf: [-86, 0]}],
    [9, {lean: 40, ry: 150, rx: 30, fh: [138, 8], bh: [-30, -34], ff: [124, 0], bf: [-74, 0], face: 'shout'}], [15, {lean: 36, ry: 152, rx: 28, fh: [132, 8], bh: [-26, -30], ff: [120, 0], bf: [-74, 0], face: 'shout'}], [23, {}]],
  upper: [[0, {}], [3, {...CROUCH, ry: 138, lean: 28, fh: [26, -54], bh: [26, -10]}],
    [6, {ry: 232, rx: 12, lean: -10, head: -14, fh: [26, 136], bh: [-34, -24], ff: [34, 92], bf: [-22, 8], face: 'shout'}],
    [14, {ry: 226, rx: 12, lean: -8, head: -10, fh: [24, 132], bh: [-30, -22], ff: [34, 88], bf: [-22, 6], face: 'shout'}], [24, {}]],
};
const 动作峰 = {jab: 4, heavy: 8, rush: 9, upper: 6}, 动作末 = {jab: 12, heavy: 28, rush: 23, upper: 24};
const 挨打 = {
  high: {lean: -26, head: -30, rx: -14, ry: 180, fh: [-8, -44], bh: [-52, 6], face: 'hurt'},
  body: {lean: 40, head: 22, rx: -10, ry: 158, fh: [12, -62], bh: [2, -70], ff: [52, 0], bf: [-66, 0], face: 'hurt'},

  轻: [姿({fh: [34, 44], lean: 2, j: 1.4}), 姿({fh: [140, 22], lean: 18, rx: 14, ff: [72, 0], face: 'shout', j: 0.1})],
  重: [姿({fh: [8, 128], bh: [10, 90], lean: -8, ry: 190, j: 1.9, face: 'grit'}), 姿({fh: [128, -16], bh: [70, -20], lean: 30, rx: 24, ry: 168, ff: [96, 0], face: 'shout', j: -0.2})],
  连: [姿({fh: [30, 20], lean: 4, j: 0.2}), 姿({fh: [146, 20], lean: 20, rx: 16, ff: [76, 0], face: 'shout', j: 0.05})],
  抓: [姿({fh: [40, 10], bh: [30, 0], lean: 10, j: 1.5}), 姿({fh: [118, 34], bh: [104, 20], lean: 24, rx: 22, ff: [84, 0], face: 'shout', j: 1.6})],
};
const 我挡 = 姿({fh: [44, 56], bh: [40, 30], lean: -6, ry: 176, head: -10, ff: [70, 0], bf: [-70, 0], face: 'grit', j: 1.55});
const 我破 = 姿({ry: 122, lean: 30, head: 16, fh: [30, -40], bh: [4, -50], ff: [62, 0], bf: [-44, 0], face: 'hurt', j: 0.6});
const 敌站 = 姿({fh: [50, 10], bh: [30, -10], ff: [64, 0], bf: [-70, 0], lean: 4, face: 'calm'});

  砸: [姿({ry: 198, lean: -16, head: -16, fh: [26, 172], bh: [4, 170], ff: [52, 0], bf: [-70, 0], face: 'grit'}), 姿({ry: 146, lean: 40, rx: 30, head: 14, fh: [122, -62], bh: [100, -72], ff: [104, 0], bf: [-84, 0], face: 'shout'})],
};
const 走 = (p, 步, 有) => 有 ? {...p, ff: [p.ff[0] + Math.sin(步) * 26, Math.max(0, Math.cos(步)) * 22], bf: [p.bf[0] - Math.sin(步) * 26, Math.max(0, -Math.cos(步)) * 22], ry: p.ry + Math.abs(Math.cos(步)) * 4} : p;
function 我姿势(t) {
  if (我.破 && 我.愣 > 0) return 我破;

  if (我.挡) return 我挡;
  if (!我.招) return 走(呼吸(我站, t), 我.步, 我.走);
  const [起, 打] = 我招姿[我.键], z = 我.招, f = 帧号 - 我.起;
  if (我.键 === '连' && 我.段 !== '出') {   // 连刺：一招里来回刺 3 下
    if (我.段 === '中') { const 间 = z.命中 / 3, k = (f - z.出手) % 间 / 间; return 混2(起, 打, k < 0.5 ? ease(k * 2) : 1 - ease((k - 0.5) * 2) * 0.6); }

}
function 敌姿势(t) {
  const f = 帧号 - 敌.段起, 长 = 敌.段长 || 1;

  if (敌.段 === '前摇') return 混2(敌站, 起, ease(f / 长 * 1.4));
  if (敌.段 === '命中') return 混2(起, 打, ease((f + 1) / 3));
  return 混2(打, 敌站, ease(f / 长));
}

// ---------------- 特效 ----------------
function 画火花(s, age) {   // 星形白芯 + 彩色外圈 + 射线 + 碎屑（age = 第几帧）
  if (age < 0 || age > 16) return;
  const {x, y, big, hue, seed} = s, k = age / 16, pop = age < 2 ? 0.7 + age * 0.3 : 1.3 - k * 0.5, R = 60 * big * pop;
  const star = (r0, r1, n, rot) => 'M' + Array.from({length: n * 2}, (_, i) => { const a = rot + i * Math.PI / n, r = i % 2 ? r0 : r1 * (0.75 + 0.5 * rnd(seed + i)); return `${(x + Math.cos(a) * r).toFixed(1)},${(y + Math.sin(a) * r).toFixed(1)}`; }).join(' L') + ' Z';
  g.globalAlpha = age > 10 ? 1 - (age - 10) / 6 : 1;
  if (age < 9) { const d = star(R * 0.32, R * 1.25, 9, seed); 填(d, hue); 描(d, 3); }
  if (age < 7) 填(star(R * 0.22, R * 0.85, 7, seed + 0.4), '#fff8d8');
  if (age < 3) { g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, R * 0.42, 0, 7); g.fill(); }
  g.globalAlpha *= 1 - k; g.strokeStyle = '#fff'; g.lineWidth = 7 * (1 - k) * big; g.beginPath(); g.arc(x, y, R * (0.6 + k * 1.3), 0, 7); g.stroke();
  g.globalAlpha = age > 10 ? 1 - (age - 10) / 6 : 1;
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * Math.PI * 2 + seed, sp = (0.7 + rnd(seed * 9 + i)) * R * 2.1 * (0.3 + k), l = 17 * big * (1 - k), bx = x + Math.cos(a) * sp, by = y + Math.sin(a) * sp;
    g.strokeStyle = i % 2 ? '#fff' : hue; g.lineWidth = 4 * big; g.lineCap = 'round'; g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + Math.cos(a) * l, by + Math.sin(a) * l); g.stroke();
  }
  g.globalAlpha = 1;
}
function 画集中线(x, y, k, seed) {   // 漫画大招的集中线
  if (k <= 0) return;
  g.globalAlpha = k * 0.75; g.fillStyle = '#fff';
  for (let i = 0; i < 46; i++) {
    const a = i / 46 * Math.PI * 2 + rnd(seed + i) * 0.1, r0 = 190 + rnd(i * 3 + seed) * 130, w = 0.012 + rnd(i * 7) * 0.02;
    g.beginPath(); g.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); g.lineTo(x + Math.cos(a - w) * 1000, y + Math.sin(a - w) * 1000); g.lineTo(x + Math.cos(a + w) * 1000, y + Math.sin(a + w) * 1000); g.fill();
  }
  g.globalAlpha = 1;
}
function 画拖影(p, w, col) {   // 拳头这几帧走过的点连成渐细的月牙
  if (p.length < 2) return;
  const A = [], B = [];
  p.forEach((q, i) => { const o = p[Math.max(0, i - 1)], r = p[Math.min(p.length - 1, i + 1)], dx = r.x - o.x, dy = r.y - o.y, d = Math.hypot(dx, dy) || 1, ww = w * (i / (p.length - 1)); A.push({x: q.x - dy / d * ww, y: q.y + dx / d * ww}); B.push({x: q.x + dy / d * ww, y: q.y - dx / d * ww}); });
  g.globalAlpha = 0.85; 填(`M${pts(A)} L${pts(B.reverse())} Z`, col); g.globalAlpha = 1;
}
function 描字(文, x, y, 号, 色, 宽 = 号 * 0.16, 对齐 = 'center', 斜 = 0) {   // 白字粗黑边（视频里的字）
  g.save(); g.translate(x, y); if (斜) g.rotate(斜);
  g.font = `italic 900 ${号}px system-ui,'PingFang SC','Microsoft YaHei',sans-serif`; g.textAlign = 对齐; g.textBaseline = 'alphabetic';
  g.lineJoin = 'round'; g.strokeStyle = INK; g.lineWidth = 宽; g.strokeText(文, 0, 0); g.fillStyle = 色; g.fillText(文, 0, 0); g.restore();
}
function 圆角(x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }



// ---------------- 舞台：黄昏荒原 ----------------
const W = 960, H = 540, 地 = 440, 格 = 76, 人z = 0.6;

const cv = document.getElementById('c'), dpr = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * dpr; cv.height = H * dpr; g = cv.getContext('2d');
let 远景 = document.createElement('canvas'); 远景.width = W; 远景.height = H;
{ const c = 远景.getContext('2d');
  const sky = c.createLinearGradient(0, 0, 0, 地); sky.addColorStop(0, '#f9e6cf'); sky.addColorStop(0.65, '#f5cfa6'); sky.addColorStop(1, '#eeb486');

  丘(34, 30, 1, 'rgba(232,170,128,.55)'); 丘(14, 18, 4, 'rgba(214,146,104,.6)');

function 量表(x, y, 值, 色, 名, 字色 = INK) {   // 竖着的小量表：框 + 往上涨的色块 + 数字
  const w = 40, h = 64;

}
function 画() {
  const t = 帧号 / 60;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const 我X = X(我.x), 敌X = X(敌.x) + (敌.段 === '前摇' ? Math.min(1, (帧号 - 敌.段起) / 20) * 12 : 0);
  // 影子
  g.fillStyle = 'rgba(70,35,15,.28)';
  g.beginPath(); g.ellipse(我X, 地 + 3, 44, 8, 0, 0, 7); g.fill(); g.beginPath(); g.ellipse(敌X, 地 + 3, 62, 10, 0, 0, 7); g.fill();
  // 霸体：地上的金色光阵 + 身后的金光
  if (on.see && 敌.光 > 0) {
    const k = 敌.光;
    g.save();   // 天是亮的，用叠加会看不出来，直接盖一层金色
    const au = g.createRadialGradient(敌X, 地 - 150, 10, 敌X, 地 - 150, 150 + 40 * k); au.addColorStop(0, `rgba(255,190,40,${0.6 * k})`); au.addColorStop(0.55, `rgba(255,200,60,${0.3 * k})`); au.addColorStop(1, 'rgba(255,190,60,0)');
    g.fillStyle = au; g.fillRect(敌X - 220, 地 - 340, 440, 360);
    g.restore();
    g.save(); g.globalAlpha = 0.5 + 0.5 * k;
    g.strokeStyle = '#ffd23f'; g.lineWidth = 4; g.beginPath(); g.ellipse(敌X, 地 + 2, 60 + 50 * k, 12 + 8 * k, 0, 0, 7); g.stroke();
    g.strokeStyle = '#fff3b0'; g.lineWidth = 2; g.beginPath(); g.ellipse(敌X, 地 + 2, (60 + 50 * k) * 0.72, (12 + 8 * k) * 0.72, 0, 0, 7); g.stroke();
    g.globalAlpha *= 0.35; g.fillStyle = '#ffcc33'; g.beginPath(); g.ellipse(敌X, 地 + 2, 60 + 50 * k, 12 + 8 * k, 0, 0, 7); g.fill();
    g.restore();
  }
  for (const p of 光点) { g.globalAlpha = p.命; g.fillStyle = '#ffe27a'; g.beginPath(); g.arc(X(p.x), Y(p.y), p.s, 0, 7); g.fill(); }
  g.globalAlpha = 1;
  const 敌光 = on.see && 敌.光 > 0 ? 敌.光 * 0.35 : 0;
  const 敌画 = 画人(敌姿势(t), 头目, 敌X, 地, 人z, -1, t + 1.3, {x: 0, y: 0}, Math.max(敌.闪 / 6, 敌光));
  const 我p = 我姿势(t);
  画人(我p, 剑客, 我X, 地, 人z, 1, t, {x: 我.走 ? 1.5 : 0, y: 0}, 我.闪 / 6, 我p.j);
  // 格挡的蓝色护盾一闪
  if (帧号 - (我.挡闪 || -99) < 12) {
    const a = (帧号 - 我.挡闪) / 12, r = (40 + 26 * a), cx = 我X + 48, cy = 地 - 150;
    const hex = 'M' + Array.from({length: 6}, (_, i) => `${cx + Math.cos(i * Math.PI / 3) * r},${cy + Math.sin(i * Math.PI / 3) * r * 1.3}`).join(' L') + ' Z';
    g.globalAlpha = 1 - a; 填(hex, 'rgba(120,220,255,.35)'); 描(hex, 6, '#bff3ff'); 描(hex, 2); g.globalAlpha = 1;
  }
  for (const s of 火花) 画火花(s, 帧号 - s.帧);
  火花 = 火花.filter(s => 帧号 - s.帧 <= 16);
  for (const p of 碎片) {
    g.globalAlpha = Math.min(1, p.命 * 3); const x = X(p.x), y = Y(p.y);
    if (p.片) { const s = 9; g.save(); g.translate(x, y); g.rotate(p.转 + 帧号 * 0.2); 填(`M0,${-s} L${s * 0.6},0 L0,${s} L${-s * 0.6},0 Z`, p.色); 描(`M0,${-s} L${s * 0.6},0 L0,${s} L${-s * 0.6},0 Z`, 2); g.restore(); }
    else { g.fillStyle = p.色; g.fillRect(x - 2, y - 2, 4, 4); }

    量表(hx, hy, 显, 显 > 参数.基础韧性 ? '#ffd23f' : '#ece8f2', 'Boss 的韧性');
    if (敌.霸体中 && on.cap) for (let i = 0; i < 参数.霸体上限; i++) {
      const cx = hx - 12 + i * 24, cy = hy - 22, d = `M${cx},${cy - 10} L${cx + 9},${cy} L${cx},${cy + 10} L${cx - 9},${cy} Z`;
      填(d, i < 参数.霸体上限 - 敌.吃下 ? '#ffd23f' : 'rgba(255,255,255,.35)'); 描(d, 3);
    }
    if (比较 && 帧号 - 比较.帧 < 70) {
      const a = (帧号 - 比较.帧) / 70; g.globalAlpha = Math.min(1, (1 - a) * 4);
      const lx = hx - 150;

      if (比较.力 !== '抓') 描字(比较.力 > 比较.韧 ? '>' : '<', (lx + hx) / 2, hy + 44, 36, 赢 ? '#ff5a6a' : '#fff', 7);
      const 文 = {断: '断', 碎: '第 3 下 · 碎！', 抓住: '霸体不防抓', 扛住: `扛住第 ${敌.吃下} 下`, 打不动: '只掉血'}[比较.果];
      描字(文, hx + 46, hy + 16, 比较.果 === '断' ? 40 : 24, 赢 ? '#ff5a6a' : '#fff', 赢 ? 7 : 5, 'left');
      g.globalAlpha = 1;
    }
  }
  for (const z of 字) { const a = (帧号 - z.帧) / 50; g.globalAlpha = Math.min(1, (1 - a) * 2); 描字(z.文, X(z.x), Y(z.y) - a * 30, z.大 ? 30 : 22, z.色, 6); }
  g.globalAlpha = 1;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 地上：两边血条 + 你的躯干条
  const 条 = (x, y, w, h, 比, 色) => { g.fillStyle = 'rgba(30,14,8,.7)'; 圆角(x, y, w, h, h / 2); g.fill(); g.fillStyle = 色; 圆角(x, y, Math.max(h, w * Math.max(0, Math.min(1, 比))), h, h / 2); if (比 > 0) g.fill(); g.strokeStyle = INK; g.lineWidth = 3; 圆角(x, y, w, h, h / 2); g.stroke(); };
  描字('你', 22, 474, 18, '#fff', 4, 'left'); 条(50, 460, 300, 18, 我.血 / 参数.我的血, '#5cdc7a');
  if (on.guard) { 描字('躯干', 22, 506, 15, '#fff', 4, 'left'); 条(62, 494, 288, 13, 我.躯干 / 参数.躯干满, 我.躯干 > 70 ? '#ff6b3b' : '#ffd23f'); }
  描字('Boss', W - 330, 474, 18, '#fff', 4, 'right'); 条(W - 320, 460, 300, 18, 敌.血 / 参数.Boss血, '#ff4d5e');
  document.getElementById('stat').textContent = `大招砸出来 ${计.砸出} 次 · 被打断 ${计.砸断} 次 · 霸体被打碎 ${计.碎} 次 · 你破防 ${计.破防} 次`;
}
let 上 = performance.now(), 累 = 0;
function 循环(now) { 累 += Math.max(0, Math.min(0.1, (now - 上) / 1000)); 上 = now; while (累 >= 1 / 60) { 累 -= 1 / 60; 一帧(); } 画(); requestAnimationFrame(循环); }
requestAnimationFrame(循环);
