<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>13 声音 · 小例子</title>
<style>
:root{--bg:#06080f;--panel:rgba(13,17,32,.9);--line:#22305a;--txt:#e8eeff;--dim:#8f9cc4;--acc:#4dc8ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#14203f,var(--bg) 60%);color:var(--txt);font:14px/1.5 system-ui,'PingFang SC','Microsoft YaHei',sans-serif;padding:12px;min-height:100vh}
body>*{max-width:1080px;margin-left:auto;margin-right:auto}
h1{font-size:22px;margin:4px auto;font-weight:900}h2{font-size:13px;color:var(--acc);margin:10px 0 4px;text-shadow:0 0 8px rgba(77,200,255,.5)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px auto}.tabs button{flex:1;min-width:120px}
button,select{background:#111a33;color:var(--txt);border:1px solid #2c3d70;border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px;font-weight:700}
button:hover,button.on{border-color:var(--acc);box-shadow:0 0 10px rgba(77,200,255,.45)}button.on{background:#16305a}
.page{display:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.page.on{display:block}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
canvas{width:100%;display:block;border-radius:10px;background:#070912;border:1px solid var(--line)}
.out{background:rgba(6,8,15,.8);border:1px solid #1a2548;border-radius:8px;padding:8px 10px;margin:6px 0}
.dim{color:var(--dim);font-size:12px}
input[type=range]{flex:1;min-width:140px;accent-color:#4dc8ff}
input[type=checkbox]{accent-color:#4dc8ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.grid button{text-align:left;padding:6px 8px;border-left:3px solid #4dc8ff}
.grid button small{display:block;color:var(--dim);font-size:11px}
.blk{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:rgba(10,14,28,.6)}
label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
</style>
</head>
<body>
<h1>13 声音：一串数字，每秒两万多个</h1>
<p class="dim">所有声音都是公式现算的，没有一个录音文件。第一次点按钮时浏览器才允许出声。</p>
<div class="tabs"><button data-t="blk" class="on">① 四块积木 → 乐器</button><button data-t="lib">② 40 种声音（每个都能调）</button><button data-t="voice">③ 配音和配乐让路</button></div>
<canvas id="wave" width="960" height="150"></canvas>
<canvas id="spec" width="960" height="150" style="margin-top:4px"></canvas>

<div class="page on" id="p-blk">
  <div class="blk"><h2>第一块：正弦波（最纯的声音，像音叉）</h2><div class="row">音高 <input type="range" id="b1f" min="80" max="2000" value="440"><b id="b1v"></b><button id="b1">听</button></div></div>
  <div class="blk"><h2>第二块：噪声（一串乱数，沙沙响）</h2><div class="row"><button id="b2w">白噪声</button><button id="b2p">粉噪声（柔一点）</button><button id="b2b">褐噪声（低沉）</button></div></div>
  <div class="blk"><h2>第三块：音量曲线（同一个音，像敲还是像吹）</h2><div class="row">起音 <input type="range" id="b3a" min="0.002" max="0.8" step="0.001" value="0.003">　衰减 <input type="range" id="b3d" min="0.05" max="2" step="0.01" value="0.3"><button id="b3">听</button><button id="b3k">像敲</button><button id="b3c">像吹</button></div></div>
  <div class="blk"><h2>第四块：滤波（去掉太高或太低的部分）</h2><div class="row">扫多快 <input type="range" id="b4s" min="0.1" max="1.5" step="0.01" value="0.35"><button id="b4">噪声 + 一开一合的滤波 = 「嗖」</button></div></div>
  <div class="blk"><h2>搭起来</h2><div class="row"><button id="c1">叮（四个高音很快消失）</button><button id="c2">琴弦（泛音整齐 1:2:3:4）</button><button id="c3">钟（泛音是乱的 1:2:2.76:5.4:8.9）</button><button id="c4">编钟（七个音按钟的比例）</button></div></div>
  <div class="blk"><h2>古筝：一小段沙沙声在圈里转，每圈把相邻两个数取平均（1983 年的拨弦算法）</h2>
    <div class="row">弦长（越短越高）<input type="range" id="z1" min="20" max="400" value="100"><b id="z1v"></b>　余音 <input type="range" id="z2" min="0.98" max="0.9995" step="0.0005" value="0.996"><button id="z">拨一下</button><button id="zg">刮奏（一口气拨十根）</button></div></div>
  <div class="blk"><h2>中国味：只用 宫 商 角 徵 羽 五个音，加大厅回声</h2><div class="row"><label><input type="checkbox" id="m7"> 混进「发」「西」两个音（对比）</label>　回声 <input type="range" id="mv" min="0" max="0.6" step="0.01" value="0.3"><button id="m">随机来一段</button></div></div>
</div>

<div class="page" id="p-lib">
  <div class="row"><b id="lName">点一个声音</b>　<span id="lHow" class="dim"></span></div>
  <div class="row"><span id="lPar" style="min-width:110px">参数</span><input type="range" id="lK" min="0" max="1" step="0.01" value="0.5"><button id="lPlay">再听一次</button></div>
  <div id="lib"></div>
</div>

<div class="page" id="p-voice">
  <div class="row">声音 <select id="vV"></select>　语速 <input type="range" id="vR" min="0.5" max="1.5" step="0.05" value="1"><b id="vRv"></b>　音高 <input type="range" id="vP" min="0.5" max="1.5" step="0.05" value="1"></div>
  <div class="row"><button id="vSay">说「天冷了，记得多穿件衣裳。」</button><button id="vOld">照顾老人家：语速放慢再说一遍</button><button id="vMus">配乐 开 / 关</button><label><input type="checkbox" id="vDuck" checked> 有人说话时配乐让路</label></div>
  <canvas id="vC" width="960" height="120"></canvas>
  <div class="out" id="vOut"></div>
</div>

<script>
// ===================== 参数表 =====================
const SR = 22050;               // 每秒多少个数（采样率）。CD 是 44100，这里用一半，算得快，够用
const 让路 = {压到: 0.25, 压下秒: 0.15, 回来秒: 0.6};   // 有人说话：配乐压到 25%，0.15 秒压下去，说完 0.6 秒回来
const 五声 = [0, 2, 4, 7, 9];    // 宫 商 角 徵 羽（相对主音的半音数）
const 七声 = [0, 2, 4, 5, 7, 9, 11];
// ================================================

// ---------- 小工具：一切都是 Float32Array ----------
let 随 = 种子(1);
function 种子(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const 长 = d => Math.max(1, Math.round(d * SR)), 空 = d => new Float32Array(长(d));
const 取 = (v, t) => typeof v === 'function' ? v(t) : v;   // 参数可以是数，也可以是「随时间变化的函数」
const 范 = (a, b) => a + (b - a) * 随();
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function 做(d, f) { const x = 空(d); for (let i = 0; i < x.length; i++) x[i] = f(i / SR, i); return x; }
function 白噪(d) { return 做(d, () => 随() * 2 - 1); }
function 粉噪(d) { let b0 = 0, b1 = 0, b2 = 0; return 做(d, () => { const w = 随() * 2 - 1; b0 = .99765 * b0 + w * .099046; b1 = .963 * b1 + w * .2965164; b2 = .57 * b2 + w * 1.0526913; return (b0 + b1 + b2 + w * .1848) * .2; }); }
function 褐噪(d) { let y = 0; return 做(d, () => { y = (y + .02 * (随() * 2 - 1)) / 1.02; return y * 3.5; }); }
function 低通(x, f, o = 2) { let y = Float32Array.from(x); for (let k = 0; k < o; k++) { let s = 0; for (let i = 0; i < y.length; i++) { const a = 1 - Math.exp(-2 * Math.PI * Math.min(取(f, i / SR), SR * .45) / SR); s += a * (y[i] - s); y[i] = s; } } return y; }
function 高通(x, f, o = 2) { let y = Float32Array.from(x); for (let k = 0; k < o; k++) { const l = 低通(y, f, 1); for (let i = 0; i < y.length; i++) y[i] -= l[i]; } return y; }
const 带通 = (x, lo, hi) => 低通(高通(x, lo), hi);
function 窄带(x, fc, q) { let lo = 0, bd = 0; const y = new Float32Array(x.length); for (let i = 0; i < x.length; i++) { const f = 2 * Math.sin(Math.PI * Math.min(取(fc, i / SR), SR * .2) / SR); lo += f * bd; const hi = x[i] - lo - bd / q; bd += f * hi; y[i] = bd; } return y; }
function 游走(d, rate, s = 7) { const r = 种子(s), pts = Array.from({length: Math.ceil(d * rate) + 3}, () => r()); return 做(d, t => { const u = t * rate, i = Math.floor(u), f = u - i, w = (1 - Math.cos(Math.PI * f)) / 2; return pts[i] * (1 - w) + pts[i + 1] * w; }); }
function 振(f, d, 形 = 'sin', duty = .5) { let ph = 0; return 做(d, t => { ph += 取(f, t) / SR; const p = ph - Math.floor(ph);
  return 形 === 'sin' ? Math.sin(2 * Math.PI * ph) : 形 === 'sq' ? (p < duty ? 1 : -1) : 形 === 'saw' ? 2 * p - 1 : 1 - 4 * Math.abs(p - .5); }); }
const 衰 = (d, rate, a = .002) => 做(d, t => Math.exp(-t * rate) * Math.min(1, t / a));
function 乘(...xs) { const y = Float32Array.from(xs[0]); for (const x of xs.slice(1)) for (let i = 0; i < y.length; i++) y[i] *= typeof x === 'number' ? x : (x[i] ?? 0); return y; }
function 加(...xs) { const y = Float32Array.from(xs[0]); for (const x of xs.slice(1)) for (let i = 0; i < y.length; i++) y[i] += x[i] ?? 0; return y; }
function 共振(fs, decs, amps, d) { return 做(d, t => fs.reduce((s, f, k) => s + Math.sin(2 * Math.PI * f * t) * Math.exp(-t * decs[k]) * amps[k], 0)); }
function 放(d, items) { const y = 空(d); for (const [s, x, g] of items) { const o = Math.round(s * SR); for (let i = 0; i < x.length && o + i < y.length; i++) y[o + i] += x[i] * g; } return y; }
function 混响(x, 秒 = 1.5, 湿 = .3) {   // 四个梳状 + 两个全通（经典的 Schroeder 混响）
  const y = Float32Array.from(x), out = new Float32Array(x.length);
  for (const dl of [1557, 1617, 1491, 1422].map(v => Math.round(v * SR / 44100))) { const g = Math.pow(10, -3 * dl / (秒 * SR)), b = new Float32Array(dl); let k = 0;
    for (let i = 0; i < y.length; i++) { const o = b[k]; b[k] = y[i] + o * g; out[i] += o * .25; k = (k + 1) % dl; } }
  for (const dl of [225, 556].map(v => Math.round(v * SR / 44100))) { const b = new Float32Array(dl); let k = 0;
    for (let i = 0; i < out.length; i++) { const o = b[k], v = out[i] + o * .5; b[k] = v; out[i] = o - v * .5; k = (k + 1) % dl; } }
  for (let i = 0; i < y.length; i++) y[i] = y[i] * (1 - 湿) + out[i] * 湿 * 2; return y; }
function 回声(x, dl, fb, n = 4) { const y = Float32Array.from(x), o = Math.round(dl * SR); for (let k = 1; k <= n; k++) for (let i = 0; i + k * o < y.length; i++) y[i + k * o] += x[i] * Math.pow(fb, k); return y; }
let 寄存器表 = null;
function 红白机噪(rate, d) {   // 15 位移位寄存器吐出的 0/1 序列
  if (!寄存器表) { 寄存器表 = new Float32Array(32767); let r = 1; for (let i = 0; i < 32767; i++) { const b = (r ^ (r >> 1)) & 1; r = (r >> 1) | (b << 14); 寄存器表[i] = r & 1 ? 1 : -1; } }
  let p = 0; return 做(d, t => { p += 取(rate, t) / SR; return 寄存器表[Math.floor(p) % 32767]; }); }
const 十六级 = e => Math.round(e * 15) / 15;   // 红白机音量只有 16 级
const 音符 = (f, d, 形 = 'sq', duty = .5, rate = 4) => { const o = 振(f, d, 形, duty); return 做(d, (t, i) => o[i] * 十六级(Math.exp(-t * rate) * Math.min(1, t / .003))); };
function 拨弦(f, d, 余 = .996) {   // 拨弦算法：一圈噪声，每转一圈相邻两个数取平均
  const L = Math.max(2, Math.round(SR / f)), buf = new Float32Array(L); for (let i = 0; i < L; i++) buf[i] = 随() * 2 - 1; let k = 0;
  return 做(d, () => { const a = buf[k], b = buf[(k + 1) % L]; buf[k] = 余 * (a + b) / 2; k = (k + 1) % L; return a; }); }
function 钟(f, d, rate = 2.2) { return 共振([f, f * 2, f * 2.76, f * 5.4, f * 8.9], [rate, rate * 1.3, rate * 1.8, rate * 3, rate * 4.5], [1, .5, .4, .15, .08], d); }
function 星星(d, s, lo, hi, n, 升 = true) { const r = 种子(s); const it = []; for (let k = 0; k < n; k++) { const st = Math.pow(r(), 升 ? .7 : 1.5) * (d - .4); const f = (lo + (hi - lo) * r()) * (1 + (升 ? st / d : 0)); it.push([st, 共振([f, f * 2.01], [9, 14], [1, .3], .4), .2 + .4 * r()]); } return 放(d, it); }

// ---------- ② 40 种声音：名字, 分类, 做法, 参数名, 函数(k) ----------
const 库 = [
  ['下雨', '大自然', '柔和的噪声 + 几百个随机水滴（每滴 = 极短、音高往上滑的「嘀」）', '雨多大', k => { const d = 2; const sheet = 乘(低通(带通(粉噪(d), 350, 9000), 7000), .5); const it = []; for (let i = 0; i < d * (60 + 400 * k); i++) { const f0 = 范(1800, 5000), dec = 范(.004, .01), x = 做(.03, t => Math.sin(2 * Math.PI * f0 * (t + 6 * t * t)) * Math.exp(-t / dec)); it.push([范(0, d - .03), x, Math.pow(范(.05, 1), 2) * .35]); } return 加(sheet, 放(d, it)); }],
  ['打雷', '大自然', '开头一声炸裂（高频噪声）+ 忽大忽小的低频轰隆 + 回声', '远 ↔ 近', k => { const d = 2.6; const crack = 乘(高通(白噪(d), 1200), 衰(d, 22), 1.6 * k); const am = 游走(d, 5, 4); const rum = 乘(低通(褐噪(d), 120 + 120 * k, 3), 做(d, (t, i) => (.35 + am[i] * am[i] * 1.4) * Math.min(1, t / .12) * Math.exp(-t * .8)), 1.8); const boom = 乘(振(t => 42 + 30 * Math.exp(-t * 4), d), 衰(d, 2.2, .02), .9); return 混响(加(crack, rum, boom), 2.2, .4); }],
  ['大风', '大自然', '噪声只放一段频率（窄带），让这个频率慢慢游走', '风多大', k => { const d = 2.4, w = 游走(d, .9, 7); const howl = 乘(窄带(粉噪(d), t => 280 + (500 + 600 * k) * w[Math.min(w.length - 1, Math.round(t * SR))], 7), .6); const body = 乘(低通(粉噪(d), 500), .5); return 乘(加(howl, body), 做(d, (t, i) => .25 + .75 * Math.pow(Math.sin(Math.PI * t / d), 1.5) * (.6 + .4 * w[i])), .5 + k); }],
  ['海浪', '大自然', '低沉的噪声涨起来再退下去，浪越大声音越「亮」', '浪多大', k => { const d = 2.6, pk = .9; const sw = 做(d, t => t < pk ? Math.pow(t / pk, 2) : Math.exp(-(t - pk) * 1.3)); const roar = 低通(加(褐噪(d), 乘(粉噪(d), .3)), t => 150 + (1500 + 2000 * k) * (t < pk ? Math.pow(t / pk, 2) : Math.exp(-(t - pk) * 1.3))); const hiss = 乘(高通(白噪(d), 3000), 做(d, t => Math.min(1, Math.max(0, (t - pk) / .2)) * Math.exp(-Math.max(0, t - pk) * 1.6)), .18 * k); return 加(乘(roar, sw, 1.2), hiss); }],
  ['篝火', '大自然', '低沉的呼呼 + 随机出现的极短「咔」（噼啪）', '噼啪多少', k => { const d = 2, w = 游走(d, 3, 9); const roar = 乘(低通(褐噪(d), 350), 做(d, (t, i) => .5 + .5 * w[i]), .45); const it = []; for (let i = 0; i < d * (10 + 50 * k); i++) { const L = Math.floor(范(60, 400)); it.push([范(0, d - .02), 做(L / SR, (t, j) => (随() * 2 - 1) * Math.exp(-j / (L / 5))), Math.pow(范(.2, 1), 2)]); } for (let i = 0; i < d * 2.5 * k + 1; i++) { const f = 范(700, 1800); it.push([范(0, d - .1), 做(.06, t => Math.sin(2 * Math.PI * f * t) * Math.exp(-t * 70)), 1.2]); } return 加(roar, 乘(高通(放(d, it), 900), .9)); }],
  ['小溪', '大自然', '上百个低音小气泡', '水量', k => { const d = 2, it = []; for (let i = 0; i < d * (60 + 200 * k); i++) { const f0 = 范(350, 1300), dec = 范(.004, .01); it.push([范(0, d - .03), 做(.03, t => Math.sin(2 * Math.PI * f0 * (t + 6 * t * t)) * Math.exp(-t / dec)), Math.pow(范(.05, 1), 2) * .5]); } return 加(放(d, it), 乘(带通(粉噪(d), 300, 2600), .12)); }],
  ['鸟叫', '大自然', '一个纯音，音高飞快地滑上滑下，加一段颤音', '音高', k => { const s = .6 + .8 * k, it = []; let st = .05; [[5200, 2600, .09], [5200, 2600, .09], [5200, 2600, .09], [3000, 4800, .07], [3000, 4800, .07], [6200, 3200, .16]].forEach(([a, b, L], j) => { let ph = 0; it.push([st, 做(L, t => { ph += (a + (b - a) * Math.pow(t / L, .7)) * s / SR; return (Math.sin(2 * Math.PI * ph) + .15 * Math.sin(4 * Math.PI * ph)) * Math.pow(Math.sin(Math.PI * t / L), 2); }), .8]); st += L + (j < 5 ? .05 : 0); }); st += .35; let ph = 0; it.push([st, 做(.5, t => { ph += (3800 + 900 * Math.sin(2 * Math.PI * 26 * t)) * s / SR; return Math.sin(2 * Math.PI * ph) * Math.pow(Math.sin(Math.PI * t / .5), 1.5) * .6; }), 1]); return 混响(放(2, it), 1, .2); }],
  ['蟋蟀', '大自然', '4700 赫兹的短音，四个一组。天越热叫得越快（真有这条规律）', '气温', k => { const d = 2, it = []; let s = .05; const gap = .55 - .35 * k; while (s < d - .2) { for (let p = 0; p < 4; p++) it.push([s + p * .032, 做(.018, t => Math.sin(2 * Math.PI * 4700 * t) * Math.sin(Math.PI * t / .018)), 1]); s += gap; } return 放(d, it); }],

}
{ const c = document.getElementById('wave'), g = c.getContext('2d'); 波底(g, c.width, c.height); g.strokeStyle = 'rgba(77,200,255,.5)'; g.beginPath(); g.moveTo(0, c.height / 2); g.lineTo(c.width, c.height / 2); g.stroke(); g.fillStyle = '#9fb0d8'; g.font = '700 12px system-ui'; g.fillText('波形：点下面任意一个「听」，这里画出那串数字', 8, 16); }
const 谱 = document.getElementById('spec'), 谱g = 谱.getContext('2d');

谱g.fillStyle = '#000004'; 谱g.fillRect(0, 0, 谱.width, 谱.height); 谱g.fillStyle = '#c8b8e8'; 谱g.font = '700 12px system-ui'; 谱g.fillText('声谱图：越亮越响，越往上越尖（从右往左滚）', 8, 15);
谱g.fillStyle = '#6a5a8a'; 谱g.textAlign = 'right'; 谱g.fillText('高音', 谱.width - 8, 15); 谱g.fillText('低音', 谱.width - 8, 谱.height - 6); 谱g.textAlign = 'left';

// ---------- ① 四块积木 ----------
const $ = id => document.getElementById(id);
$('b1f').oninput = () => $('b1v').textContent = $('b1f').value + ' 赫兹（每秒振动这么多次）'; $('b1f').oninput();

$('b2w').onclick = () => 播(乘(白噪(1.2), .5)); $('b2p').onclick = () => 播(粉噪(1.2)); $('b2b').onclick = () => 播(褐噪(1.2));

$('b3').onclick = 包络音;
$('b3k').onclick = () => { $('b3a').value = .003; $('b3d').value = .15; 包络音(); };
$('b3c').onclick = () => { $('b3a').value = .6; $('b3d').value = 1.2; 包络音(); };

$('c1').onclick = () => 播(共振([2093, 2637, 3136, 4186], [8, 9, 11, 14], [1, .7, .5, .3], 1.2));
$('c2').onclick = () => 播(共振([220, 440, 660, 880, 1100, 1320], [1.5, 2, 2.6, 3.2, 4, 5], [1, .5, .33, .25, .2, .16], 2));
$('c3').onclick = () => 播(钟(330, 2.5));
$('c4').onclick = () => 播(放(3, [0, 3, 5, 7, 10, 12].map((m, i) => [i * .35, 共振([1, 2, 2.76, 3.9, 5.4, 6.8, 8.9].map(r => r * mf(60 + m)), [1.6, 2.2, 3, 4, 5, 6, 7], [1, .45, .5, .25, .18, .1, .08], 1.8), .5])));
$('z1').oninput = () => $('z1v').textContent = `圈长 ${$('z1').value} 个数 → 约 ${Math.round(SR / $('z1').value)} 赫兹`; $('z1').oninput();

$('m').onclick = () => { const 表 = $('m7').checked ? 七声 : 五声, it = []; let s = .05; let 上一个 = 2;
  for (let j = 0; j < 14; j++) { 上一个 = Math.max(0, Math.min(表.length * 2 - 1, 上一个 + Math.round((随() - .5) * 4))); const m = 62 + 表[上一个 % 表.length] + 12 * Math.floor(上一个 / 表.length); const L = 随() < .3 ? .5 : .25; it.push([s, 拨弦(mf(m), 1.6, .996), .5]); s += L; }
  播(混响(放(s + 1.5, it), 2, +$('mv').value)); };

// ---------- ② 声音库 ----------
let 选中 = 0;
const 分类 = [...new Set(库.map(x => x[1]))];

function 放库(i) { 选中 = i; const [名, , 做法, 参] = 库[i]; $('lName').textContent = 名; $('lHow').textContent = 做法; $('lPar').textContent = 参;
  随 = 种子(i + 1); 播(库[i][4](+$('lK').value)); document.querySelectorAll('#lib button').forEach(b => b.classList.toggle('on', +b.dataset.i === i)); }

// ---------- ③ 配音和让路 ----------
let 配乐源, 配乐增益, 配乐开 = false, 说话中 = false, 增益记录 = [];
function 做配乐() { 随 = 种子(99); const it = []; let s = 0; const 和 = [0, 7, 9, 4]; for (let bar = 0; bar < 4; bar++) for (let j = 0; j < 8; j++) { const m = 62 + 五声[Math.floor(随() * 5)] + (随() < .3 ? 12 : 0); it.push([s, 拨弦(mf(m), 1.2, .995), .35]); if (j === 0) it.push([s, 拨弦(mf(38 + 和[bar]), 2, .998), .6]); s += .25; } return 归一(混响(放(8, it), 2, .3), .7); }
$('vMus').onclick = () => { const a = 境(); if (配乐开) { 配乐源.stop(); 配乐开 = false; return; }
  const x = 做配乐(), b = a.createBuffer(1, x.length, SR); b.copyToChannel(x, 0); 配乐源 = a.createBufferSource(); 配乐源.buffer = b; 配乐源.loop = true; 配乐增益 = a.createGain(); 配乐增益.gain.value = 1; 配乐源.connect(配乐增益).connect(分析); 配乐源.start(); 配乐开 = true; 画波(x); };
function 压(下) { if (!配乐增益 || !$('vDuck').checked) return; const g = 配乐增益.gain, t = 音境.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(下 ? 让路.压到 : 1, t + (下 ? 让路.压下秒 : 让路.回来秒)); }
const 有语音 = 'speechSynthesis' in window;
function 填声音() { if (!有语音) { $('vV').innerHTML = '<option>（这个浏览器没有语音合成，用「嘀嘀」代替人声）</option>'; return; }
  const vs = speechSynthesis.getVoices().filter(v => /zh|cmn|yue/i.test(v.lang)); $('vV').innerHTML = (vs.length ? vs : speechSynthesis.getVoices()).map((v, i) => `<option value="${v.name}">${v.name}（${v.lang}）</option>`).join('') || '<option>（没有找到中文声音，用「嘀嘀」代替人声）</option>'; }
if (有语音) speechSynthesis.onvoiceschanged = 填声音; 填声音();
function 说(慢) { 境(); const 字 = '天冷了，记得多穿件衣裳。', rate = 慢 ? Math.min(+$('vR').value, .8) : +$('vR').value;
  const vs = 有语音 ? speechSynthesis.getVoices() : [], v = vs.find(x => x.name === $('vV').value);
  if (v) { const u = new SpeechSynthesisUtterance(字); u.voice = v; u.lang = v.lang; u.rate = rate; u.pitch = +$('vP').value;
    // 一调用就压下去（不等 onstart，有的浏览器不发这个事件）；说完回来，onend 没来就按字数估一个时长兜底
    clearTimeout(说.兜底); const 完 = () => { if (说.当前 !== u) return; clearTimeout(说.兜底); 说话中 = false; 压(false); }; 说.当前 = u;
    u.onend = 完; u.onerror = 完; 说.兜底 = setTimeout(完, (字.length * .28 / rate + 1.5) * 1000);
    speechSynthesis.cancel(); 说话中 = true; 压(true); speechSynthesis.speak(u); }
  else { const 秒 = 2.2 / rate; 说话中 = true; 压(true); const it = []; for (let s = 0; s < 秒; s += .14 / rate) it.push([s, 乘(振(220 + 80 * 随(), .1), 做(.1, t => Math.sin(Math.PI * t / .1))), .6]); 播(放(秒, it)); setTimeout(() => { 说话中 = false; 压(false); }, 秒 * 1000); }
  $('vOut').innerHTML = `语速 ${rate.toFixed(2)}${慢 ? '（给老人家放慢）' : ''}。${$('vDuck').checked ? '说话时配乐在 ' + 让路.压下秒 + ' 秒内压到 ' + 让路.压到 * 100 + '%，说完 ' + 让路.回来秒 + ' 秒回来——下面这条线就是配乐的音量。' : '没开让路：配乐和人声抢在一起。'}`; }
$('vSay').onclick = () => 说(false); $('vOld').onclick = () => 说(true);
$('vR').oninput = () => $('vRv').textContent = '×' + $('vR').value; $('vR').oninput();
function 画增益() { const c = $('vC'), g = c.getContext('2d'), W = c.width, H = c.height; 增益记录.push(配乐增益 && 配乐开 ? 配乐增益.gain.value : 0); if (增益记录.length > W / 2) 增益记录.shift();
  g.fillStyle = '#070912'; g.fillRect(0, 0, W, H); g.strokeStyle = '#5cff8a'; g.shadowColor = '#5cff8a'; g.shadowBlur = 8; g.lineWidth = 2.5; g.beginPath(); 增益记录.forEach((v, i) => { const y = H - 10 - v * (H - 30); i ? g.lineTo(i * 2, y) : g.moveTo(i * 2, y); }); g.stroke();
  g.shadowBlur = 0; g.fillStyle = '#9fb0d8'; g.font = '700 12px system-ui'; g.fillText('配乐音量（绿线）' + (说话中 ? '　● 正在说话' : ''), 6, 14); requestAnimationFrame(画增益); }
