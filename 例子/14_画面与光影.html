<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>14 画面与光影 · 小例子</title>
<style>
:root{--bg:#0f0e14;--panel:#18171f;--line:#2b2936;--txt:#ece9f3;--dim:#9b97a8;--acc:#ffc84a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,sans-serif;padding:12px;max-width:1080px;margin:auto}
h1{font-size:18px;margin:4px 0}h2{font-size:13px;color:var(--acc);margin:8px 0 4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tabs button{flex:1;min-width:120px}
button,select{background:#262432;color:var(--txt);border:1px solid #3a3748;border-radius:6px;padding:5px 9px;cursor:pointer;font-size:13px}
button:hover,button.on{border-color:var(--acc)}button.on{background:#3a3320}
.page{display:none}.page.on{display:block}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
canvas{width:100%;display:block;border-radius:8px;background:#000}
.out{background:#18171f;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}
.dim{color:var(--dim);font-size:12px}
input[type=range]{flex:1;min-width:140px}
label{display:inline-flex;gap:4px;align-items:center;cursor:pointer;background:#1e1d27;border:1px solid #33313f;border-radius:6px;padding:3px 7px}
label.on{border-color:#6b5a2a}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px}
</style>
</head>
<body>
<h1>14 画面与光影：模型决定有什么，着色器决定什么样</h1>
<div class="tabs"><button data-t="A" class="on">① 光影一层层打开</button><button data-t="B">② 着色器入门 8 步</button><button data-t="C">③ 画面五十年</button></div>

<div class="page on" id="p-A">
  <canvas id="glA" width="480" height="270"></canvas>
  <div class="row" id="层钮"></div>
  <div class="row"><button id="aAll">全开</button><button id="aNone">全关（剪纸）</button><button id="aStep">一层一层加上去</button>
    画风 <select id="aSty"><option value="0">写实</option><option value="1">卡通（分色块 + 描边）</option><option value="2">水墨（墨色 + 留白）</option></select>
    <label><input type="checkbox" id="aMove" checked> 水在动</label></div>
  <div class="row">太阳：早 <input type="range" id="aSun" min="0" max="1" step="0.01" value="0.3"> 傍晚</div>
  <div class="out" id="aOut"></div>
</div>

<div class="page" id="p-B">
  <canvas id="glB" width="960" height="540"></canvas>
  <div class="steps" id="步钮"></div>
  <div class="row"><span id="bPn" style="min-width:90px"></span><input type="range" id="bP" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="out" id="bOut"></div>
  <div class="row"><button id="bRace">比一比：处理器（一个人）算 vs 显卡（几千人同时算）</button><span id="bRaceOut" class="dim"></span></div>
</div>

<div class="page" id="p-C">
  <canvas id="cv" width="960" height="540"></canvas>
  <div class="steps" id="代钮"></div>
  <div class="row" id="cCtl"></div>
  <div class="out" id="cOut"></div>
</div>

<script>
// ===================== 参数表 =====================
const 光影层 = [   // 名字, 一句话
  ['光照', '按每个面朝太阳的角度算明暗：朝光亮，背光暗'],
  ['材质', '金属高光又亮又锐、玉石温润透光、石头粗糙几乎不反光'],
  ['影子', '从地面朝太阳看一眼，被挡住就是影子；离挡的东西越远，边越虚'],
  ['环境光遮蔽', '墙角、缝隙、贴地的地方天光进不去，自然变暗'],
  ['水面', '斜看像镜子、低头看得见水底（菲涅尔）；水底有晃动的光纹（焦散）'],
  ['体积光', '空气里有薄雾，被柱子挡住的地方留下一道道光柱'],
  ['高动态范围 + 泛光', '亮度可以超过「白」，再压回屏幕能显示的范围；太亮的地方溢出光晕'],
  ['光线追踪反射', '光碰到金属球再弹一次，球上照出周围真实的东西'],
];
const 步骤 = [  // 名字, 滑杆名, 说明
  ['① 坐标→颜色', '蓝色多少', '每个像素只回答一个问题：我是什么颜色？最简单的答案：越往右越红，越往上越绿。'],
  ['② 画一个圆', '半径', '算每个像素离中心多远：近的涂红，远的涂白。没有「画圆」这个命令，只有「算距离」。'],
  ['③ 加上时间', '动多大', '把时间放进公式，画面就动起来：圆心跟着 sin(时间) 走，半径一呼一吸。'],
  ['④ 噪声', '格子大小', '左半：每个格子一个随机数 = 电视雪花，太乱。右半：格子之间平滑过渡 = 柔和的起伏（1983 年为电影特效发明）。'],
  ['⑤ 几层叠起来', '叠几层', '大小不同的几层噪声叠起来，一层比一层细、一层比一层淡，就是云、雾、石头的纹理。'],
  ['⑥ 水墨山水', '雾多浓', '把噪声当成山的轮廓，由远到近画四层，远的淡、近的浓，山脚加雾。'],
  ['⑦ 光线步进（三维）', '太阳角度', '从眼睛朝每个像素射一条线，一步步往前走（每步走「离最近物体的距离」），碰到就停，再按光的方向算明暗和影子。'],
  ['⑧ 分形', '形状参数', '把球换成分形公式：同一个公式反复套几次，就是金色的立体图案。'],
];
const 年代 = [  // 名字, 说明
  ['1972 电路画线', '没有图片也没有程序：球和球拍是几十块电路芯片直接在电视信号里「画」出来的短线。'],
  ['1979 矢量屏', '电子束像一支笔在屏幕上直接画线：不存像素，只存「从哪画到哪」，和今天的 SVG 是一个思路。'],
  ['1984 现场算星球', '程序只有 22KB，却装下 8 个星系、两千多个星球：星球不存，从一个数字现场算出来。拖动「星系编号」，同一个编号永远是同一组星球。'],
  ['1985 8×8 三色', '一个小图块 8×8 格，只能用 3 种颜色加透明。头发画不清、嘴巴动不了 → 所以给角色戴帽子、留胡子、穿背带裤。'],
  ['1996 早期 3D', '几百个三角形，贴图又小又糊；没有小数精度，顶点只能落在整数像素上 → 画面一抖一抖；贴图按「平的」方式铺，斜着看会扭。'],
  ['2004 现算贴图', '一个团队把整个 3D 射击游戏塞进 96KB：贴图不存成图片，运行时用公式现算。'],
];
// ================================================

const $ = id => document.getElementById(id);
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'p-' + b.dataset.t)); 当前标签 = b.dataset.t; 要画 = true; });
let 当前标签 = 'A', 要画 = true;

// ---------- 共用的着色器工具（GLSL 只认英文） ----------
const 头 = `precision highp float;
uniform vec2 R; uniform float T;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y); }
float fbm(vec2 p){ float s=0.,a=.5; for(int i=0;i<5;i++){ s+=a*noise(p); p=p*2.03+7.1; a*=.5; } return s; }
float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.); }
`;
function 建(cv, 片) {
  const gl = cv.getContext('webgl', {preserveDrawingBuffer: true}); if (!gl) return null;
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}')); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, 头 + 片)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('着色器链接失败 ' + gl.getProgramInfoLog(p)); gl.useProgram(p);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(p, 'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  const u = {}; return {gl, set(n, v) { u[n] = u[n] || gl.getUniformLocation(p, n); Array.isArray(v) ? (v.length === 2 ? gl.uniform2fv(u[n], v) : gl.uniform1fv(u[n], v)) : gl.uniform1f(u[n], v); }, 画() { gl.viewport(0, 0, cv.width, cv.height); gl.drawArrays(gl.TRIANGLES, 0, 3); }};
}

// ======================= ① 光影八层 =======================
const 片A = `
uniform float L[8]; uniform float STY, SUN;
vec3 sunDir; vec3 SUNC = vec3(1.,.88,.72)*2.4; vec3 SKYC = vec3(.32,.45,.65);
vec2 mapA(vec3 p){
  float pool = sdBox(p-vec3(2.,0.,.3), vec3(1.5,.45,1.4));
  vec2 r = vec2(max(p.y,-pool), 1.);
  float m = length(p-vec3(-.9,.6,.3))-.6; if(m<r.x) r=vec2(m,2.);
  float j = length(p-vec3(.25,.45,-1.))-.45; if(j<r.x) r=vec2(j,3.);
  float s = sdBox(p-vec3(-2.6,.45,-.7),vec3(.42))-.04; if(s<r.x) r=vec2(s,4.);
  vec3 q = p-vec3(0.,1.7,3.4); q.x = mod(q.x+.95,1.9)-.95;
  float pl = max(sdBox(q,vec3(.25,1.7,.25)), abs(p.x)-4.6);
  pl = min(pl, sdBox(p-vec3(0.,3.5,3.4),vec3(4.6,.2,.35)));
  if(pl<r.x) r=vec2(pl,5.);
  return r;
}
vec3 nrm(vec3 p){ vec2 e=vec2(.0015,-.0015);
  return normalize(e.xyy*mapA(p+e.xyy).x+e.yyx*mapA(p+e.yyx).x+e.yxy*mapA(p+e.yxy).x+e.xxx*mapA(p+e.xxx).x); }
vec2 march(vec3 ro, vec3 rd){ float t=.02, m=-1.;
  for(int i=0;i<100;i++){ vec2 h=mapA(ro+rd*t); if(h.x<.0012*t){ m=h.y; break; } t+=h.x; if(t>30.) break; } return vec2(t,m); }
float shadow(vec3 ro, vec3 rd){ float s=1., t=.03;
  for(int i=0;i<36;i++){ float h=mapA(ro+rd*t).x; s=min(s,9.*h/t); if(s<.002) break; t+=clamp(h,.03,.5); if(t>12.) break; } return clamp(s,0.,1.); }
float occl(vec3 p, vec3 n){ float o=0., w=1.;
  for(int i=1;i<6;i++){ float d=.09*float(i); o+=w*(d-mapA(p+n*d).x); w*=.65; } return clamp(1.-2.2*o,0.,1.); }
bool inPool(vec3 p){ return p.x>.5&&p.x<3.5&&p.z>-1.1&&p.z<1.7; }
vec3 sky(vec3 rd){ vec3 c = mix(vec3(.75,.8,.85), SKYC*1.4, clamp(rd.y*1.6,0.,1.));
  float s = max(dot(rd,sunDir),0.); c += SUNC*(pow(s,900.)*12.);
  if(rd.y<0.) c = mix(c, vec3(.42,.38,.32), clamp(-rd.y*4.,0.,1.));
  if(STY>1.5) c = vec3(.94,.91,.83); return c; }
vec3 albedo(float m, vec3 p){
  if(m<1.5){ float g = fbm(p.xz*2.5); vec3 c = vec3(.58,.52,.43)*(.75+.5*g);
    vec2 t = abs(fract(p.xz*.8)-.5); c *= .82+.18*smoothstep(.0,.04,min(t.x,t.y)); if(p.y<-.2) c=vec3(.42,.5,.45)*(.8+.4*g); return c; }
  if(m<2.5) return vec3(1.,.76,.33);
  if(m<3.5) return vec3(.3,.72,.52);
  if(m<4.5) return vec3(.46,.44,.41)*(.6+.8*fbm(p.xy*5.+p.z*3.));
  return vec3(.72,.64,.56);
}
float rough(float m){ return m<1.5?.85: m<2.5?.18: m<3.5?.32: m<4.5?.95:.7; }
float caust(vec2 p){ float t=T*.8; float c=0.;
  for(int i=0;i<3;i++){ vec2 q=p*float(i+2)*1.3+vec2(t*.6,-t*.4)*float(i+1); c+=pow(1.-abs(sin(q.x+sin(q.y+t))*sin(q.y*1.1+sin(q.x*.9-t))),6.); } return c; }
vec3 shadeBasic(vec3 p, vec3 n, vec3 rd, float m, float lite){
  vec3 a = albedo(m,p);
  float sh = (L[2]>.5&&lite<.5) ? shadow(p+n*.01,sunDir) : 1.;
  float ao = (L[3]>.5&&lite<.5) ? occl(p,n) : 1.;
  if(L[0]<.5) return a*(.55+.45*sh)*(.6+.4*ao);
  float ndl = max(dot(n,sunDir),0.);
  if(m>2.5&&m<3.5&&L[1]>.5) ndl = max((dot(n,sunDir)+.5)/1.5,0.);
  if(STY>.5&&STY<1.5){ float d=ndl*sh; d = d>.45?1.: d>.12?.55:.28; vec3 c=a*d*1.05;
    if(L[1]>.5){ vec3 h=normalize(sunDir-rd); if(dot(n,h)>.97&&sh>.5) c=vec3(1.); }
    return c*(.75+.25*ao); }
  vec3 amb = SKYC*(.5+.5*n.y)*.75*ao;
  vec3 col;
  if(L[1]>.5){
    float r = rough(m); bool metal = m>1.5&&m<2.5;
    vec3 h = normalize(sunDir-rd); float shin = 2./max(r*r*r*r,.0006)-2.;
    float F0 = metal? 1.: .04; float fr = F0+(1.-F0)*pow(1.-max(dot(h,-rd),0.),5.);
    vec3 spec = (metal? a: vec3(1.))*fr*pow(max(dot(n,h),0.),shin)*(shin+8.)/25.*ndl;
    vec3 dif = metal? vec3(0.): a*(SUNC*ndl*sh/3.14+amb);
    col = dif + SUNC*spec*sh*.5;
    if(metal) col += a*sky(reflect(rd,n))*.85*ao;
    if(m>2.5&&m<3.5) col += vec3(.2,.6,.4)*pow(max(dot(rd,sunDir),0.),2.)*.35;
  } else col = a*(SUNC*ndl*sh/3.14+amb);
  if(L[4]>.5&&inPool(p)&&p.y<-.2) col += SUNC*caust(p.xz)*.12*sh;
  return col;
}
// 金属球反射和水面反射共用「一次」反射追踪：写成两段时，Windows 的显卡编译器（D3D）会编崩，整页黑掉
vec3 scene(vec3 ro, vec3 rd, out float tHit, out float rim){
  vec2 h = march(ro,rd); tHit = h.x; rim = 1.;
  vec3 col; vec3 p = ro+rd*h.x; vec3 n = vec3(0,1,0);
  float kind = 0.; vec3 ro2 = p, rd2 = rd, base = vec3(0.); float fr = 0.;   // kind 1 = 金属球反射，2 = 水面反射
  if(h.y<0.) col = sky(rd);
  else { n = nrm(p); col = shadeBasic(p,n,rd,h.y,0.); rim = h.y<1.5 ? 1. : max(dot(n,-rd),0.);
    if(h.y>1.5&&h.y<2.5&&L[7]>.5&&L[0]>.5&&STY<.5){ kind = 1.; ro2 = p+n*.02; rd2 = reflect(rd,n); } }
  float tw = (-.1-ro.y)/rd.y;
  if(rd.y<0.&&tw>0.&&tw<tHit){ vec3 pw = ro+rd*tw;
    if(inPool(pw)){ kind = 0.;
      if(L[4]>.5){ vec2 e=pw.xz*3.; float w = T*1.2;
        vec3 wn = normalize(vec3((noise(e+vec2(w,0))-noise(e+vec2(w,0)+vec2(.1,0)))*1.2,1.,(noise(e+vec2(0,w))-noise(e+vec2(0,w)+vec2(0,.1)))*1.2));
        kind = 2.; ro2 = pw+vec3(0,.01,0); rd2 = reflect(rd,wn); base = col*vec3(.55,.8,.85);
        fr = .02+.98*pow(1.-max(dot(wn,-rd),0.),5.);
      } else col = vec3(.2,.38,.55)*(L[0]>.5? .6+.6*max(sunDir.y,0.): 1.);
      tHit = tw; rim = 1.; } }
  if(kind>.5){ vec2 h2 = march(ro2,rd2); vec3 rc;
    if(h2.y<0.) rc=sky(rd2); else { vec3 p2=ro2+rd2*h2.x; rc=shadeBasic(p2,nrm(p2),rd2,h2.y,1.); }
    col = kind<1.5 ? col*.25 + albedo(2.,p)*rc*.8 : mix(base, rc, fr); }
  return col;
}
void main(){
  vec2 uv = (gl_FragCoord.xy-.5*R)/R.y;
  sunDir = normalize(mix(normalize(vec3(-.85,.6,-.35)), normalize(vec3(.1,.16,1.)), SUN));
  if(SUN>.6) SUNC = mix(SUNC, vec3(1.,.55,.3)*2.6, (SUN-.6)/.4);
  vec3 ro = vec3(.4,2.1,-6.6), ta = vec3(.2,.5,.8);
  vec3 f = normalize(ta-ro), r = normalize(cross(vec3(0,1,0),f)), u = cross(f,r);
  vec3 rd = normalize(uv.x*r+uv.y*u+1.6*f);
  float tHit, rim; vec3 col = scene(ro,rd,tHit,rim);
  if(L[5]>.5){ float tm = min(tHit,16.), acc=0.; float dith = hash(gl_FragCoord.xy+T);
    for(int i=0;i<16;i++){ float t = tm*(float(i)+dith)/16.; vec3 q = ro+rd*t; float lit = 1.; float s=.05;
      for(int k=0;k<10;k++){ float hh = mapA(q+sunDir*s).x; if(hh<.01){ lit=0.; break; } s+=max(hh,.08); if(s>8.) break; }
      acc += lit; }
    float fog = 1.-exp(-tm*.06); float ph = .15+2.2*pow(max(dot(rd,sunDir),0.),6.);
    col = col*(1.-fog*.25) + SUNC*acc/16.*fog*ph*.35; }
  if(L[6]>.5){ col += SUNC*pow(max(dot(rd,sunDir),0.),14.)*.35; col *= .7;
    col = clamp((col*(2.51*col+.03))/(col*(2.43*col+.59)+.14),0.,1.); }
  else col = clamp(col*.85,0.,1.);
  if(STY>.5&&STY<1.5){ if(rim<.25) col = vec3(.08,.07,.1); }
  if(STY>1.5){ float lum = dot(col,vec3(.3,.55,.15)); float ink = clamp(1.-lum*1.25,0.,1.);
    ink = smoothstep(.15,.95,ink); ink += (hash(gl_FragCoord.xy*.37)-.5)*.06;
    vec3 paper = vec3(.94,.91,.83); col = mix(paper, vec3(.1,.1,.12), ink*.9);
    if(rim<.3) col = mix(col, vec3(.08), .8); }
  gl_FragColor = vec4(pow(col,vec3(1./2.2)),1.);
}`;
const 层开 = 光影层.map(() => true);
const 层钮 = $('层钮');
层钮.innerHTML = 光影层.map(([n], i) => `<label class="on" title="${光影层[i][1]}"><input type="checkbox" data-i="${i}" checked>${i + 1} ${n}</label>`).join('');
function 同步层钮() { 层钮.querySelectorAll('input').forEach(c => { c.checked = 层开[c.dataset.i]; c.parentNode.classList.toggle('on', c.checked); }); 说A(); 要画 = true; }
层钮.onchange = e => { 层开[e.target.dataset.i] = e.target.checked; 停加层(); 同步层钮(); };
let 加层计时 = 0;
function 停加层() { clearInterval(加层计时); 加层计时 = 0; }
$('aAll').onclick = () => { 停加层(); 层开.fill(true); 同步层钮(); };
$('aNone').onclick = () => { 停加层(); 层开.fill(false); 同步层钮(); };
